<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Счёт на оплату</title>
  <script src="invoice.js?v=invoice-layout-20260903c"></script>
  <style>
    :root{--ink:#2B1A6B;--soft:#F3ECFA;--line:#CDB9E8}
    *{box-sizing:border-box}
    body{margin:0;background:#eee8f5;color:var(--ink);font:14px/1.45 Arial,sans-serif}
    .page{max-width:940px;margin:24px auto}
    .actions{position:fixed;right:16px;bottom:16px;z-index:2;margin:0}
    .actions button{border:1px solid var(--line);border-radius:9px;padding:9px 13px;background:#fff;color:var(--ink);font-weight:700;cursor:pointer;box-shadow:0 2px 10px #2b1a6b24}
    .invoice-sheet{background:#fff;padding:34px 38px;box-shadow:0 2px 16px #2b1a6b20}
    .invoice-head{display:flex;gap:18px;align-items:center;padding-bottom:18px;border-bottom:2px solid var(--line)}
    .invoice-logo{width:180px;height:54px;flex:0 0 180px;object-fit:contain;object-position:left center}
    .invoice-issuer{margin-left:auto;text-align:right;font-size:12px}
    .invoice-issuer a{color:inherit;text-decoration:underline;text-underline-offset:2px}
    .invoice-title{margin:25px 0 18px}
    .invoice-title h1{font-size:24px;line-height:1.1;margin:0}
    .invoice-title p{margin:5px 0 0}
    .invoice-payment{display:grid;grid-template-columns:142px minmax(0,1fr);grid-template-areas:"qr bank";gap:18px;align-items:center}
    .invoice-bank-grid{grid-area:bank;display:grid;grid-template-columns:58% 42%;min-width:0;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--soft)}
    .invoice-bank-grid>div{min-height:54px;padding:7px 12px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);display:flex;flex-direction:column;justify-content:center}
    .invoice-bank-grid>div:nth-child(2n){border-right:0}
    .invoice-bank-grid>div:nth-last-child(-n+2){border-bottom:0}
    .invoice-bank-grid span,.invoice-parties span,.invoice-purpose span{font-size:10px;text-transform:uppercase;color:#68578f;letter-spacing:.35px}
    .invoice-bank-grid b{font-size:12px;white-space:nowrap;font-variant-numeric:tabular-nums}
    .invoice-qr{width:142px;min-width:142px;padding:5px;background:#fff;border:1px solid var(--line);border-radius:10px}
    .invoice-qr img,.invoice-qr canvas{display:block;margin:auto}
    .invoice-qr-desktop{display:block;grid-area:qr;justify-self:start}
    .invoice-qr-mobile{display:none}
    .invoice-party-qr-area{display:block}
    .invoice-parties{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:18px 0}
    .invoice-parties>div,.invoice-purpose{border:1px solid var(--line);border-radius:9px;padding:9px 11px;background:#fbf9fe}
    .invoice-parties b,.invoice-purpose b{display:block;margin-top:3px}
    .invoice-parties small{display:block;margin-top:4px}
    .invoice-items{width:100%;table-layout:fixed;border-collapse:separate;border-spacing:0;border:1px solid var(--line);border-radius:10px;overflow:hidden}
    .invoice-items th{background:var(--soft);font-size:10px;text-transform:uppercase;letter-spacing:.25px}
    .invoice-items th,.invoice-items td{padding:9px 8px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);text-align:left}
    .invoice-items th:nth-child(1){width:5%}.invoice-items th:nth-child(2){width:34%}.invoice-items th:nth-child(3){width:9%}.invoice-items th:nth-child(4){width:7%}.invoice-items th:nth-child(5){width:18%}.invoice-items th:nth-child(6){width:6%}.invoice-items th:nth-child(7){width:21%}
    .invoice-items th:not(:nth-child(2)),.invoice-items td:not(:nth-child(2)){text-align:center}
    .invoice-items th:nth-child(3),.invoice-items th:nth-child(5),.invoice-items th:nth-child(7){white-space:nowrap;letter-spacing:0}
    .invoice-items .invoice-money{white-space:nowrap;font-variant-numeric:tabular-nums;line-height:1.15;overflow:hidden}
    .invoice-items th:last-child,.invoice-items td:last-child{border-right:0;text-align:right}
    .invoice-items tfoot td{border-bottom:0;font-weight:800;background:#fbf9fe}
    .invoice-purpose{margin-top:16px}
    @media(max-width:620px){
      .page{margin:0}.actions{right:12px;bottom:12px}.invoice-sheet{padding:20px 14px;box-shadow:none}.invoice-head{align-items:flex-start}.invoice-logo{width:112px;height:34px;flex-basis:112px}.invoice-issuer{font-size:10px}.invoice-title h1{font-size:20px}
      .invoice-payment{display:block}.invoice-payment .invoice-qr-desktop{display:none}
      .invoice-bank-grid{grid-template-columns:56% 44%;font-size:10px}.invoice-bank-grid>div{padding:6px;min-height:50px}.invoice-bank-grid b{font-size:10px;overflow-wrap:anywhere}
      .invoice-party-qr-area{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px;align-items:stretch;margin:18px 0}
      .invoice-party-qr-area .invoice-parties{grid-column:1;grid-row:1;grid-template-columns:1fr;gap:8px;margin:0;min-width:0}
      .invoice-party-qr-area .invoice-parties>div{min-width:0;padding:7px 9px}
      .invoice-qr-mobile{grid-column:2;grid-row:1;display:flex;width:100%;min-width:0;align-items:center;justify-content:center;padding:5px}
      .invoice-party-qr-area .invoice-qr-mobile canvas,.invoice-party-qr-area .invoice-qr-mobile img{display:block;width:100%!important;max-width:100%;height:auto!important}
      .invoice-items{font-size:9px}.invoice-items th,.invoice-items td{padding:6px 2px}.invoice-items th:nth-child(1){width:6%}.invoice-items th:nth-child(2){width:31%}.invoice-items th:nth-child(3){width:11%;white-space:nowrap}.invoice-items th:nth-child(4){width:7%}.invoice-items th:nth-child(5){width:17%}.invoice-items th:nth-child(6){width:6%}.invoice-items th:nth-child(7){width:22%}.invoice-items .invoice-money{white-space:nowrap}
    }
    @media print{body{background:#fff}.page{max-width:none;margin:0}.actions{display:none}.invoice-sheet{box-shadow:none;padding:13mm 12mm}.invoice-title{margin-top:16px}}
  </style>
</head>
<body>
  <main class="page">
    <div class="actions"><button onclick="window.print()">Скачать PDF</button></div>
    <div id="root"></div>
  </main>
  <script>
    const id=RaleksizInvoice.readToken(),root=document.getElementById('root');
    (async()=>{
      if(!/^[A-Za-z0-9]{10,15}$/.test(id)){root.innerHTML='<p>Ссылка на счёт недействительна.</p>';return}
      let d;
      try{
        const r=await fetch(RaleksizInvoice.API+'/invoices/'+id,{cache:'no-store'});
        if(r.status===404){root.innerHTML='<p>Счёт не найден.</p>';return}
        if(!r.ok)throw new Error();
        d=await r.json()
      }catch(_){root.innerHTML='<p>Не удалось загрузить счёт. Повтори попытку позже.</p>';return}
      try{
        const draft=document.createElement('div');
        draft.innerHTML=RaleksizInvoice.documentHtml(d);
        RaleksizInvoice.drawQrs(draft);
        root.replaceChildren(...draft.childNodes);
        RaleksizInvoice.fitAmounts(root);
        window.addEventListener('resize',()=>RaleksizInvoice.fitAmounts(root),{passive:true});
        document.title='Счёт № '+d.number
      }catch(e){root.innerHTML='<p>Не удалось сформировать обязательный QR-код. Счёт не показан.</p>'}
    })();
  </script>
</body>
</html>
