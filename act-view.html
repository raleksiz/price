<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Акт оказанных услуг</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="icon" type="image/png" sizes="32x32" href="acts_offer-32.png">
<link rel="apple-touch-icon" sizes="180x180" href="acts_offer-180.png">
<style>
*{box-sizing:border-box;margin:0;padding:0;}
:root{--bg:#F4F0FA;--card:#fff;--ink:#2B1A6B;--muted:#888;--line:#E4E5EA;--violet:#7C3AED;--violet-d:#5B21B6;--soft:#F3ECFA;--ok:#16a34a;--warn:#E65100;--bad:#dc2626;--navy:#1F2A44;--ink-soft:#666B73;--purple:#6E3B8C;}
body{font-family:Inter,system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--ink);min-height:100vh;margin:0;padding:0 0 60px;-webkit-text-size-adjust:100%;}
.wrap{max-width:1180px;margin:0 auto;padding:16px 12px 0;}
header.brand{
  background:#FFFFFF;
  border-bottom:3px solid var(--navy);
  padding:18px 20px 12px;
  position:sticky;top:0;z-index:40;
  transition:transform .22s ease;
}
header.brand.is-hidden{transform:translateY(-110%);}
header.brand .brand-row{
  max-width:980px;margin:0 auto;
  display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;
}
header.brand img.logo{height:57px;width:auto;display:block;}
header.brand .contacts{text-align:right;font-size:12px;color:var(--ink-soft);line-height:1.55;}
header.brand .contacts.wrapped{text-align:left;}
header.brand .contacts .name{font-style:italic;font-weight:700;color:var(--navy);font-size:13px;font-family:Montserrat,Arial,sans-serif;}
header.brand .contacts .inn{font-style:italic;}
header.brand .contacts .handles{color:var(--purple);}
.handle-item{display:inline-block;white-space:nowrap;}
.handle-item + .handle-item{margin-left:6px;}
.icon-link{display:inline-flex;align-items:center;gap:4px;color:inherit;text-decoration:none;}
.icon-link .icon-svg{color:#A9ADB6;}
.icon-link:hover{color:var(--navy);}
.icon-link:hover .icon-svg{color:var(--navy);}
.icon-svg{display:block;}
@media (max-width:640px){
  header.brand{padding:14px 14px 10px;}
  header.brand .brand-row{gap:10px;}
  header.brand img.logo{height:46px;}
}
.card{background:var(--card);border-radius:16px;padding:22px 20px;box-shadow:0 8px 32px rgba(80,40,120,.10);margin-bottom:16px;}
.logo{font-family:Montserrat,system-ui,sans-serif;font-weight:800;font-size:16px;letter-spacing:.5px;color:var(--muted);margin-bottom:4px;}
h1{font-size:18px;font-weight:800;margin-bottom:2px;}
h2{font-size:15px;font-weight:700;margin:18px 0 10px;padding-top:14px;border-top:1.5px solid var(--line);}
h2:first-of-type{border-top:none;padding-top:0;}
h3{font-size:13px;font-weight:700;color:#6E3B8C;margin:14px 0 6px;}
.muted{color:var(--muted);font-size:12px;line-height:1.6;}
.state{text-align:center;padding:60px 16px;color:var(--muted);font-size:14px;}
.err{color:var(--bad);}
.client-name{font-size:20px;font-weight:800;margin-bottom:4px;}
.applied{font-size:11.5px;color:#777;margin-top:3px;line-height:1.5;}

.contract-block{border:1.5px solid var(--line);border-radius:14px;padding:16px 16px 8px;margin-bottom:18px;}
.contract-head{
  display:grid;
  grid-template-columns:minmax(0,1fr) auto;
  grid-template-rows:auto auto auto;
  column-gap:10px;row-gap:2px;
  align-items:start;margin-bottom:10px;
}
.contract-head > *{min-width:0;}
.contract-title{grid-column:1;grid-row:1;font-size:15px;font-weight:800;color:var(--ink);}
.contract-meta{grid-column:1;grid-row:2;font-size:12px;color:#666;line-height:1.6;overflow-wrap:anywhere;}
.contract-basis{grid-column:1;grid-row:3;font-size:12px;color:#666;line-height:1.6;overflow-wrap:anywhere;}
.contract-filter-control{grid-column:2;grid-row:2 / 4;align-self:end;justify-self:end;}
.contract-meta b{color:var(--ink);}

.pill{display:inline-block;padding:2px 8px;border-radius:20px;font-size:11px;font-weight:700;white-space:nowrap;}
.pill.ok{background:#E9F7EE;color:#1E6B3C;}
.pill.no{background:#FEE2E2;color:#991B1B;}
.pill.part{background:#FFFDE7;color:#7A6000;}
.pill.pre{background:#EDE9FE;color:#5B21B6;}
@media (min-width:721px){
  .svc-row .c-status .pill.part{
    white-space:normal;
    line-height:1.25;
    max-width:100%;
    box-sizing:border-box;
  }
  .svc-row .c-status .pill.part .part-rest{display:block;}
}

.svc-scroll,
.svc-head-scroll,
.svc-body-scroll{
  display:block;width:100%;max-width:100%;min-width:0;
  overflow-y:hidden;
  -webkit-overflow-scrolling:touch;
}
.svc-scroll{overflow-x:auto;}
.svc-head-scroll,.svc-body-scroll{overflow-x:hidden;}
.svc-head-scroll.has-x-overflow,.svc-body-scroll.has-x-overflow{overflow-x:auto;}
.svc-head-scroll{background:#fff;}
.svc-head-scroll::-webkit-scrollbar,
.svc-body-scroll::-webkit-scrollbar,
.svc-scroll::-webkit-scrollbar{height:8px;}
.svc-head-scroll,
.svc-body-scroll,
.svc-scroll{scrollbar-width:thin;}
.svc-scroll-inner{width:100%;min-width:0;}
.svc-list{display:flex;flex-direction:column;overflow-x:visible;width:100%;}
.contract-block{min-width:0;max-width:100%;overflow:hidden;}
.svc-head{
  display:grid;
  grid-template-columns:28px 90px 55px minmax(215px,1fr) 90px 90px 150px;
  gap:8px;padding:0 6px 6px;
  font-size:10px;text-transform:uppercase;letter-spacing:.3px;color:var(--muted);
  border-bottom:1.5px solid var(--line);
  min-width:0;
}
.svc-head > div:nth-child(5),.svc-head > div:nth-child(6){text-align:left;justify-self:start;}
.svc-row{
  display:grid;
  grid-template-columns:28px 90px 55px minmax(215px,1fr) 90px 90px 150px;
  grid-template-areas:"num date code desc price paid status";
  align-items:start;gap:8px;padding:9px 6px;border-bottom:1px solid #F0F0F3;font-size:13px;
  min-width:0;
}
.svc-row .c-num{grid-area:num;color:#888;font-variant-numeric:tabular-nums;}
.svc-row .c-date{grid-area:date;white-space:nowrap;}
.svc-row .c-code{grid-area:code;white-space:nowrap;}
.svc-row .c-desc{grid-area:desc;overflow-wrap:anywhere;word-break:break-word;}
.svc-row .c-price{grid-area:price;text-align:left;justify-self:start;font-variant-numeric:tabular-nums;white-space:nowrap;}
.svc-row .c-paid{grid-area:paid;text-align:left;justify-self:start;font-variant-numeric:tabular-nums;white-space:nowrap;}
.svc-row .c-status{grid-area:status;white-space:normal;text-align:left;}
.svc-row .c-status .pay-stack{display:flex;flex-direction:column;gap:3px;align-items:flex-start;}
.svc-row .c-codedesc,.svc-row .c-priceinfo{display:none;}

.svc-head.abon-special,
.svc-row.abon-special{
  grid-template-columns:28px 90px 55px minmax(215px,1fr) 150px;
  grid-template-areas:"num date code desc status";
}
.svc-row.abon-special .c-price,
.svc-row.abon-special .c-paid{display:none !important;}
.svc-row.abon-special .c-priceinfo{display:none;}

@media (max-width:720px){
  .card,.wrap{min-width:0;max-width:100%;}
  .svc-scroll-inner{
    width:max(100%, 780px);
    min-width:780px;
    max-width:none;
  }
  .svc-head,
  .svc-list,
  .svc-row{
    width:100%;
    box-sizing:border-box;
  }
  .svc-head{display:grid;}
  .svc-row .c-date::before{content:none;}
  .svc-row .c-codedesc,
  .svc-row .c-priceinfo{display:none;}
  .svc-row .c-code,
  .svc-row .c-desc,
  .svc-row .c-price,
  .svc-row .c-paid,
  .svc-row .c-status{display:block;}
  .svc-row.abon-special .c-price,
  .svc-row.abon-special .c-paid{display:none !important;}
}

.comp-block{margin-top:18px;padding-top:14px;border-top:1.5px solid var(--line);min-width:0;max-width:100%;}
.comp-block h2{font-size:16px;margin:0 0 8px;}
.comp-formula{font-size:13px;line-height:1.6;margin-bottom:10px;}
.comp-formula b{font-variant-numeric:tabular-nums;}
.comp-month{background:var(--soft);border-radius:10px;padding:10px 12px;margin:10px 0;width:100%;max-width:100%;min-width:0;overflow:hidden;box-sizing:border-box;}
.comp-month h3{margin:0 0 6px;font-size:14px;text-transform:none;letter-spacing:0;}
.comp-svc-scroll,
.comp-svc-head-scroll,
.comp-svc-body-scroll{
  display:block;width:100%;max-width:100%;min-width:0;
  overflow-y:hidden;
  -webkit-overflow-scrolling:touch;
}
.comp-svc-scroll{overflow-x:auto;}
.comp-svc-head-scroll,.comp-svc-body-scroll{overflow-x:hidden;}
.comp-svc-head-scroll.has-x-overflow,.comp-svc-body-scroll.has-x-overflow{overflow-x:auto;}
.comp-svc-scroll,
.comp-svc-head-scroll{margin-top:8px;}
.comp-svc-body-scroll{margin-top:0;}
.comp-svc-head-scroll{background:#fff;}
.comp-svc-head-scroll::-webkit-scrollbar,
.comp-svc-body-scroll::-webkit-scrollbar,
.comp-svc-scroll::-webkit-scrollbar{height:8px;}
.comp-svc-head-scroll,
.comp-svc-body-scroll,
.comp-svc-scroll{scrollbar-width:thin;}
.comp-svc{width:max-content;min-width:740px;border-collapse:collapse;font-size:12px;margin:0;table-layout:fixed;}
.comp-svc th,.comp-svc td{padding:5px 8px;border-bottom:1px solid #e8e4f4;text-align:left;vertical-align:top;}
.comp-svc th{font-size:10.5px;font-weight:700;text-transform:none;color:#6E3B8C;white-space:normal;line-height:1.25;letter-spacing:0;}
.comp-col-date{width:104px;}
.comp-col-code{width:56px;}
.comp-col-desc{width:240px;}
.comp-col-num{width:108px;}
@media (min-width:721px){
  .comp-svc{width:100%;min-width:740px;}
  .comp-col-desc{width:auto;}
}
.comp-svc-date,.comp-svc-code,
.comp-svc th:nth-child(1),.comp-svc th:nth-child(2){
  white-space:nowrap;overflow:hidden;
}
.comp-svc-desc{white-space:normal;overflow-wrap:anywhere;word-break:break-word;line-height:1.35;}
.comp-svc .num{text-align:right;font-variant-numeric:tabular-nums;}
.comp-svc td.num{white-space:nowrap;}
.comp-up{color:#b42318;font-weight:700;}
.comp-down{color:#167c3a;font-weight:700;}
.comp-same{color:#777;}
.comp-total{font-size:20px;font-weight:800;margin:8px 0 10px;font-variant-numeric:tabular-nums;}
.mtot{font-size:12px;color:#666;margin:4px 0 4px;padding-left:2px;}
.mtot + .svc-month-title{margin-top:22px;}

.totals{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px;}
.tot{background:var(--soft);border-radius:10px;padding:7px 9px;min-width:0;flex:1 1 0;text-align:center;}
.tot .l{font-size:9px;text-transform:uppercase;color:#6E3B8C;font-weight:700;letter-spacing:.3px;white-space:nowrap;}
.tot .v{font-size:13px;font-weight:800;margin-top:1px;font-variant-numeric:tabular-nums;}
@media (max-width:720px){
  .totals{flex-wrap:nowrap;gap:6px;}
  .totals .tot{padding:6px 5px;}
  .totals .tot:first-child{flex:1.6 1 0;}
  .totals .tot:not(:first-child){flex:0.85 1 0;}
  .totals .tot .l{font-size:8.3px;}
  .totals .tot .v{font-size:12px;}
}
@media (max-width:480px){
  .totals{gap:5px;}
  .totals .tot{padding:6px 4px;}
  .totals .tot .l{font-size:7.3px;}
  .totals .tot .v{font-size:11.5px;}
}

.grand-totals{display:flex;gap:12px;flex-wrap:wrap;margin-top:8px;}
.grand-tot{background:var(--soft);border-radius:10px;padding:12px 16px;min-width:150px;flex:1;border:1.5px solid #C4B5FD;}
.grand-tot .l{font-size:10.5px;text-transform:uppercase;color:#6E3B8C;font-weight:700;letter-spacing:.3px;}
.grand-tot .v{font-size:18px;font-weight:800;margin-top:3px;font-variant-numeric:tabular-nums;}
@media (max-width:720px){
  .grand-totals{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:5px;flex-wrap:nowrap;}
  .grand-tot{padding:6px 4px;min-width:0;width:100%;text-align:center;}
  .grand-tot .l{font-size:7.3px;white-space:nowrap;letter-spacing:0;}
  .grand-tot .v{font-size:11.5px;margin-top:2px;}
}
@media (max-width:480px){
  .grand-totals{gap:4px;}
  .grand-tot{padding:5px 3px;}
  .grand-tot .l{font-size:6.8px;}
  .grand-tot .v{font-size:11px;}
}

.act-footer{
  margin-top:16px;
  font-size:12px;
  color:var(--muted);
  line-height:1.6;
}
.act-footer-link{
  color:var(--violet);
  text-decoration:none;
  font-weight:600;
}
.act-footer-link:hover{text-decoration:underline;}

.filter-box{display:none;margin:0 0 12px;padding:10px 12px;background:#F8F6FF;border:1px solid #E7DFF7;border-radius:10px;}
.filter-box.open{display:block;}
.filter-toggle{width:auto;height:36px;white-space:nowrap;border:1px solid #C4B5FD;background:#fff;color:#6E3B8C;border-radius:8px;padding:7px 10px;font:600 12px inherit;cursor:pointer;}
.filter-form{display:none;margin-top:0;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;align-items:end;}
.filter-form.open{display:grid;}
.filter-form label{display:block;font-size:9px;text-transform:uppercase;color:#888;font-weight:700;margin-bottom:4px;}
.filter-form input{width:100%;border:1px solid #DDD;border-radius:7px;padding:7px 8px;font:12px inherit;color:var(--ink);background:#fff;min-width:0;}
.act-filter{position:relative;min-width:0;}
.act-filter-drop{
  position:absolute;left:0;right:0;top:calc(100% + 2px);z-index:30;
  max-height:220px;overflow-y:auto;
  background:#fff;border:1px solid #DDD;border-radius:8px;
  box-shadow:0 8px 24px rgba(80,40,120,.12);
}
.act-filter-drop.hidden{display:none;}
.act-filter-drop button{
  display:block;width:100%;padding:7px 9px;border:0;background:#fff;
  color:var(--ink);font:12px inherit;text-align:left;cursor:pointer;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.act-filter-drop button:hover,.act-filter-drop button.active{background:#F8F6FF;color:var(--violet);}
.act-filter-drop .filter-empty-option{padding:8px 9px;color:#888;font-size:12px;}
@media(max-width:720px){
  .filter-form label{font-size:10px;}
  .filter-form input{font-size:11px;padding:6px 7px;}
  .filter-toggle{height:40px;font-size:11px;padding:6px 9px;}
}
.filter-actions{display:flex;gap:6px;}
.filter-actions button{border:0;border-radius:7px;padding:7px 10px;font:600 12px inherit;cursor:pointer;}
.filter-apply{background:var(--ink);color:#fff;}.filter-reset{background:#eee;color:#555;}
.applied-box{margin-top:6px;padding:7px 9px;background:#F8F6FF;border-radius:8px;color:#666;font-size:11px;line-height:1.55;}
.applied-box summary{cursor:pointer;color:#6E3B8C;font-weight:700;list-style:none;}
.applied-box summary::-webkit-details-marker{display:none;}
.applied-box summary:before{content:'▸';margin-right:5px;}.applied-box[open] summary:before{content:'▾';}
.applied-list{margin:5px 0 0 18px;padding:0;}.applied-list li{margin:2px 0;overflow-wrap:anywhere;}
.cf-public-list{margin-top:7px;padding-top:7px;border-top:1px solid #F0F0F3;font-size:11.5px;line-height:1.55;}
.cf-public-item{margin:4px 0;overflow-wrap:anywhere;}.cf-public-item b{color:var(--ink);}
.cf-public-item a{color:var(--violet);text-decoration:none;font-size:inherit;font-weight:inherit;}.cf-public-item a:hover{text-decoration:underline;}
.cf-public-item ul{margin:4px 0 4px 18px;padding:0;list-style:disc;}.cf-public-item li{margin:2px 0;}
.cf-public-item:has(.cf-link-list),
.cf-public-item .cf-link-list{font-size:13px;font-weight:400;line-height:1.35;}
.svc-desc-text{display:inline;}
.act-field-changed{
  background:#F3EEFF;
  border-radius:6px;
  box-shadow:0 0 0 2px rgba(124,58,237,.28);
  -webkit-box-decoration-break:clone;
  box-decoration-break:clone;
}
.svc-row.act-service-new{
  background:#F7F2FF;
  box-shadow:inset 3px 0 0 rgba(124,58,237,.58);
}
.svc-row.act-service-deleted{
  background:#FFF7F7;
  color:#6B5960;
  box-shadow:inset 3px 0 0 rgba(185,28,28,.50);
}
.svc-row.act-service-deleted .c-num{color:#9A7B83;}
.svc-row.act-service-deleted .pill{filter:saturate(.68);opacity:.82;}
.deleted-label{
  display:inline-block;
  margin:0 7px 3px 0;
  padding:2px 7px;
  border-radius:999px;
  background:#FEE2E2;
  color:#991B1B;
  font-size:10px;
  font-weight:800;
  letter-spacing:.35px;
  vertical-align:1px;
}
.act-change-banner{
  position:fixed;
  right:18px;
  bottom:18px;
  z-index:1000;
  width:min(360px,calc(100vw - 36px));
  padding:13px 52px 13px 15px;
  border:1px solid #D8CCF3;
  border-radius:12px;
  background:#FFFFFF;
  color:var(--ink);
  box-shadow:0 12px 34px rgba(43,26,107,.18);
  font-size:12.5px;
  line-height:1.45;
  cursor:grab;
  user-select:none;
  touch-action:none;
}
.act-change-banner.dragging{cursor:grabbing;}
.act-change-banner-close{
  position:absolute;
  top:50%;right:5px;
  width:42px;height:42px;
  transform:translateY(-50%);
  display:flex;align-items:center;justify-content:center;
  border:0;border-radius:9px;
  background:transparent;color:#6B6478;
  font:400 24px/1 Arial,sans-serif;
  cursor:pointer;
}
.act-change-banner-close:hover{background:#F5F1FC;color:var(--ink);}
@media(max-width:720px){
  body.act-change-banner-open{padding-bottom:calc(60px + var(--act-change-banner-height,0px));}
  .act-change-banner{
    left:0;right:0;bottom:0;
    width:auto;
    padding:12px 54px calc(12px + env(safe-area-inset-bottom)) 14px;
    border-width:1px 0 0;
    border-radius:12px 12px 0 0;
    font-size:12px;
    cursor:default;
    user-select:text;
    touch-action:auto;
  }
  .act-change-banner-close{top:22px;right:5px;transform:none;}
}
@media print{
  .act-change-banner{display:none !important;}
  .act-field-changed,.svc-row.act-service-new{background:transparent !important;box-shadow:none !important;}
  .svc-row.act-service-deleted{display:none !important;}
}
@media (min-width:721px){
  .svc-row .c-desc,
  .cf-public-list,
  .cf-public-item,
  .cf-public-item ul,
  .cf-public-item li{
    min-width:0;
    max-width:100%;
    overflow-wrap:anywhere;
    word-break:break-word;
    white-space:normal;
  }
}
.offer-link{color:var(--violet);font-weight:700;text-decoration:none;}.offer-link:hover{text-decoration:underline;}
.empty-filter{padding:10px 4px;color:#888;font-size:12px;}
@media(max-width:720px){
  .filter-form.open{display:grid;grid-template-columns:1fr 1fr;}
  .filter-actions{grid-column:1/-1;}
  .contract-block{padding:13px 12px 8px;}
}
@media(max-width:430px){.filter-form.open{grid-template-columns:1fr;}.filter-actions{grid-column:auto;}}
</style>
</head>
<body>
<header class="brand">
  <div class="brand-row">
    <img class="logo" src="brand-logo.png" alt="Рузлев Алексей Иванович">
    <div class="contacts">
      <div class="name">ИП Рузлев Алексей Иванович</div>

<script>
const ACT_API  = 'https://act.raleksiz-law.workers.dev/';
const BASE_URL = 'https://raleksiz.github.io/price/';
const MONTHS = ['январь','февраль','март','апрель','май','июнь','июль','август','сентябрь','октябрь','ноябрь','декабрь'];
const {
  escapeHtml: esc,
  safeHttpUrl,
  paidOf,
  prepayOf,
  cashPaidOf,
  paidForAbonementMonth
} = RaleksizCRMCore;

function money(n){ return Math.round(Number(n)||0).toLocaleString('ru-RU') + ' ₽'; }
function fmtDate(iso){ if(!iso) return ''; const p=String(iso).split('-'); return p.length===3?`${p[2]}.${p[1]}.${p[0]}`:String(iso); }
function monthKey(iso){ return iso?String(iso).slice(0,7):''; }
function monthTitle(mk){
  if(!mk) return '';
  const [y,m]=mk.split('-');
  const month=MONTHS[Number(m)-1]||'';
  return month ? month.charAt(0).toUpperCase()+month.slice(1)+' '+y+' года' : '';
}
function monthTitleInText(mk){
  const title=monthTitle(mk);
  return title ? title.charAt(0).toLowerCase()+title.slice(1) : '';
}
function isComplete(s){ return !!(s&&s.date&&String(s.desc||'').trim()); }
function isProvided(s,today){ return isComplete(s) && String(s.date).slice(0,10)<=(today||todayISO()); }
function isPayFull(s){ return !!(s&&(s.pay==='full'||s.pay==='full_prepay')); }
function todayISO(){
  const d=new Date();
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
}
function monthLastISO(month){
  const y=Number(String(month).slice(0,4)), m=Number(String(month).slice(5,7));
  const last=new Date(y, m, 0).getDate();
  return String(month).slice(0,7)+'-'+String(last).padStart(2,'0');
}
function reportingPeriod(month, today){
  today = today || todayISO();
  month = String(month||'').slice(0,7);
  if(!month) return {start:'', end:'', empty:true};
  const start = month+'-01';
  const last = monthLastISO(month);
  if(today < start) return {start, end:start, empty:true};
  return {start, end: today < last ? today : last, empty:false};
}
function contractPriceForMonth(ct, month){
  month = String(month||'').slice(0,7);
  if(ct && ct.contractPriceSnapshots && ct.contractPriceSnapshots[month]!=null) return Number(ct.contractPriceSnapshots[month])||0;
  return Number(ct && ct.contractPrice)||0;
}
function servicesInReportingMonth(c, ct, month, today){
  const p = reportingPeriod(month, today);
  if(p.empty) return [];
  return contractServices(c, ct.id).filter(s=>isProvided(s, today) && s.date>=p.start && s.date<=p.end);
}
function isAbonementSpecialMonth(c, ct, month, today){
  if(!ct || ct.status!=='Абонемент') return false;
  const p = reportingPeriod(month, today);
  if(p.empty) return false;
  const budget = contractPriceForMonth(ct, month);
  if(!(budget>0)) return false;
  const actual = servicesInReportingMonth(c, ct, month, today).reduce((a,s)=>a+(Number(s.price)||0),0);
  return actual < budget;
}
function displayPaidForMonth(ct, month, services, special){
  const list=(services||[]).filter(s=>monthKey(s&&s.date)===month);
  if(!special || !ct || ct.status!=='Абонемент') return list.reduce((sum,s)=>sum+paidOf(s),0);

  const paid=paidForAbonementMonth(list, month);
  const prepayServices=list.filter(s=>s&&(s.pay==='full_prepay'||s.pay==='part_prepay'));
  const hasActualPrepay=prepayServices.some(s=>s.actualPrepay!=null&&s.actualPrepay!=='');
  if(!prepayServices.length||hasActualPrepay) return paid;

  const legacyPrepay=ct.prepaySnapshots&&ct.prepaySnapshots[month]!=null
    ? Number(ct.prepaySnapshots[month])||0
    : Number(ct.prepay)||0;
  return legacyPrepay+list.reduce((sum,s)=>sum+cashPaidOf(s),0);
}
function displayContractTotals(c, ct, today){
  today = today || todayISO();
  const all = contractServices(c, ct.id).filter(s=>isProvided(s,today));
  if(!ct || ct.status!=='Абонемент') return contractTotals(c, ct.id, all);
  const months = [...new Set(all.map(s=>monthKey(s.date)).filter(Boolean))];
  let sum=0, paid=0;
  months.forEach(m=>{
    const monthAll = all.filter(s=>monthKey(s.date)===m);
    const special = isAbonementSpecialMonth(c, ct, m, today);
    paid += displayPaidForMonth(ct, m, monthAll, special);
    sum += special ? contractPriceForMonth(ct, m) : monthAll.reduce((a,s)=>a+(Number(s.price)||0),0);
  });
  return {sum, paid, debt:Math.max(0,sum-paid), count:all.length};
}
function displayVisibleTotals(c,ct,list,today){
  if(!ct || ct.status!=='Абонемент') return contractTotals(c,ct&&ct.id,list);
  const months=[...new Set((list||[]).map(s=>monthKey(s.date)).filter(Boolean))];
  let sum=0,paid=0;
  months.forEach(month=>{
    const visible=(list||[]).filter(s=>monthKey(s.date)===month);
    const completeMonth=servicesInReportingMonth(c,ct,month,today).length===visible.length;
    const special=completeMonth&&isAbonementSpecialMonth(c,ct,month,today);
    sum+=special?contractPriceForMonth(ct,month):visible.reduce((total,s)=>total+(Number(s.price)||0),0);
    paid+=completeMonth?displayPaidForMonth(ct,month,visible,special):visible.reduce((total,s)=>total+paidOf(s),0);
  });
  return {sum,paid,debt:Math.max(0,sum-paid),count:(list||[]).length};
}
function sortServices(list){
  return list.slice().sort((a,b)=>{
    const d=String(b.date||'').localeCompare(String(a.date||''));
    return d!==0?d:String(b.createdAt||'').localeCompare(String(a.createdAt||''));
  });
}
function getContract(c,id){ return (c.contracts||[]).find(x=>x.id===id)||null; }
function contractServices(c,id){ return (c.services||[]).filter(s=>s.contractId===id); }
function offerBasisDate(ct){
  if(!ct || ct.basisType!=='offer') return '';
  if(ct.offerDate) return ct.offerDate;
  if(ct.basisDate) return ct.basisDate;
  return '';
}
function basisText(ct, opts){
  opts = opts || {};
  if(!ct) return '';
  const useOffer = opts.useOfferWord !== false;
  if(ct.basisType==='contract') return 'договор'+(ct.basisDoc?' № '+ct.basisDoc:'')+(ct.basisDate?' от '+fmtDate(ct.basisDate):'');
  if(ct.basisType==='addendum'){
    let t = 'дополнительное соглашение'+(ct.basisDoc?' № '+ct.basisDoc:'')+(ct.basisDate?' от '+fmtDate(ct.basisDate):'');
    if(ct.basisParentDoc || ct.basisParentDate){
      t += ' к договору'+(ct.basisParentDoc?' № '+ct.basisParentDoc:'')+(ct.basisParentDate?' от '+fmtDate(ct.basisParentDate):'');
    }
    return t;
  }
  if(ct.basisType==='offer'){
    const d = offerBasisDate(ct);
    const word = useOffer ? 'оффер' : 'персональное предложение';
    return d ? word+' от '+fmtDate(d) : word;
  }
  if(ct.basisType==='request') return 'обращение'+(ct.basisDate?' от '+fmtDate(ct.basisDate):'');
  return '';
}
function contractLabel(ct){
  if(ct.title) return ct.title;
  const b = basisText(ct, {useOfferWord:false});
  return b ? b.charAt(0).toUpperCase()+b.slice(1) : 'Договор';
}
function contractBasisLabel(ct){
  const b = basisText(ct, {useOfferWord:true});
  return b ? b.charAt(0).toUpperCase()+b.slice(1) : contractLabel(ct);
}
function offerLinkHtml(ct){
  if(!ct || ct.basisType!=='offer' || !ct.basisUrl) return '';
  const url = safeHttpUrl(ct.basisUrl);
  if(!url) return '';
  const d = offerBasisDate(ct);
  const label = d ? 'Оффер от '+fmtDate(d) : 'Оффер';
  return `<a class="offer-link" href="${esc(url)}" target="_blank" rel="noopener">${esc(label)}</a>`;
}
function basisBlockHtml(ct){
  if(!ct) return '';
  const offerLink = offerLinkHtml(ct);
  if(offerLink) return `<div>Основание: ${offerLink}</div>`;
  const b = contractBasisLabel(ct);
  return b ? `<div>Основание: ${esc(b)}</div>` : '';
}
function payPill(s){
  const price=Number(s.price)||0, paid=paidOf(s), pre=prepayOf(s)>0;
  let main;
  if(isPayFull(s) || (price>0 && paid>=price)) main='<span class="pill ok">Оплачено</span>';
  else if(paid<=0) main='<span class="pill no">Не оплачено</span>';
  else main='<span class="pill part">Оплачено <span class="part-rest">частично</span></span>';
  return `<span class="pay-stack">${main}${pre?'<span class="pill pre">Предоплата</span>':''}</span>`;
}
function clientPayLabel(s){
  const paid=paidOf(s), price=Number(s.price)||0;
  if(isPayFull(s) || (price>0 && paid>=price)) return 'Оплачено';
  if(paid<=0) return 'Не оплачено';
  return 'Оплачено частично';
}
function contractTotals(c,id,listOverride){
  const list=(listOverride||contractServices(c,id)).filter(s=>isProvided(s));
  const sum=list.reduce((a,s)=>a+(Number(s.price)||0),0);
  const paid=list.reduce((a,s)=>a+paidOf(s),0);
  return {sum,paid,debt:Math.max(0,sum-paid),count:list.length};
}
function tot(l,v){ return `<div class="tot"><div class="l">${l}</div><div class="v">${v}</div></div>`; }
function grandTot(l,v){ return `<div class="grand-tot"><div class="l">${l}</div><div class="v">${v}</div></div>`; }

function appliedItems(s){
  const list=Array.isArray(s.applied)?s.applied.filter(a=>a&&a.name):[];
  const has=list.some(a=>/скидка исполнителя/i.test(String(a.name||'')));
  const exec=Math.round(Number(s.executorDiscount)||0);
  if(has || !(exec>0)) return list;
  return list.concat([{name:'Скидка исполнителя',amount:-exec,count:1}]);
}
function formatAppliedLabel(a){
  if(typeof Calculator!=='undefined' && Calculator.formatAppliedLabel) return Calculator.formatAppliedLabel(a);
  const name=String(a.name||'').trim();
  const comment=String(a.comment||'').trim();
  const amount=Math.round(Number(a.amount)||0);
  if(/скидка исполнителя/i.test(name) && amount) return name+' ('+amount.toLocaleString('ru-RU')+')';
  return comment ? name+' ('+comment+')' : name;
}
function appliedHtml(s,expanded=false){
  const arr=appliedItems(s);
  if(!arr.length) return '';
  const items=arr.map(a=>`<li>${esc(formatAppliedLabel(a))}</li>`).join('');
  return `<details class="applied-box" data-field-key="applied" ${expanded?'open':''}><summary>Применённые надбавки/скидки</summary><ul class="applied-list">${items}</ul></details>`;
}
function customFieldValue(raw){
  if(raw&&typeof raw==='object'&&!Array.isArray(raw)) return {value:String(raw.value??''),public:!!raw.public};
  return {value:String(raw??''),public:false};
}
function parseCustomLinks(raw){
  if(raw==null || raw==='') return [];
  let list=[];
  if(Array.isArray(raw)) list=raw;
  else {
    const t=String(raw).trim();
    if(!t) return [];
    try{ list=JSON.parse(t); }catch(e){ return []; }
  }
  if(!Array.isArray(list)) return [];
  return list.map(item=>{
    if(!item||typeof item!=='object') return null;
    return {name:String(item.name||'').slice(0,20), url:String(item.url||'')};
  }).filter(x=>x && (String(x.name).trim() || String(x.url).trim()));
}
function customLinksDisplayHtml(rawValue){
  const items=parseCustomLinks(rawValue).map(item=>{
    const title=String(item.name||'').trim() || 'Ссылка';
    const href=safeHttpUrl(item.url);
    const label=href ? `<a href="${esc(href)}" target="_blank" rel="noopener">${esc(title)}</a>` : esc(title);
    return `<li>${label}</li>`;
  });
  if(!items.length) return '';
  return `<ul class="cf-link-list">${items.join('')}</ul>`;
}
function renderCustomFields(s,db){
  const fields=Array.isArray(db.customFields)?db.customFields:[];
  const out=[];
  fields.forEach(f=>{
    const raw=(s.custom||{})[f.id];
    const x=customFieldValue(raw);
    if(!x.public) return;
    const fieldKey=esc('custom:'+f.id);
    if(f.type==='link'){
      const shown=customLinksDisplayHtml(x.value);
      if(!shown) return;
      out.push(`<div class="cf-public-item" data-field-key="${fieldKey}"><b>${esc(f.name)}:</b>${shown}</div>`);
      return;
    }
    if(!x.value.trim()) return;
    if(f.type==='bulleted'){
      const items=x.value.split(/\r?\n/).map(v=>v.trim()).filter(Boolean);
      out.push(`<div class="cf-public-item" data-field-key="${fieldKey}"><b>${esc(f.name)}:</b><ul>${items.map(v=>`<li>${esc(v)}</li>`).join('')}</ul></div>`);
    }else{
      const value=esc(x.value).replace(/\r\n?|\n/g,'<br>');
      out.push(`<div class="cf-public-item" data-field-key="${fieldKey}"><b>${esc(f.name)}:</b> ${value}</div>`);
    }
  });
  return out.length?`<div class="cf-public-list">${out.join('')}</div>`:'';
}
function buildCurrentActSnapshot(c,db){
  const engine=window.RaleksizActChanges;
  if(!engine||typeof engine.buildSnapshot!=='function') return null;
  try{
    const today=todayISO();
    return engine.buildSnapshot({
      client:c,
      customFields:Array.isArray(db.customFields)?db.customFields:[],
      today,
      capturedAt:new Date().toISOString(),
      isProvided,
      contractPresentation:ct=>({
        label:contractLabel(ct),
        basis:contractBasisLabel(ct)
      }),
      servicePresentation:(s,ct)=>{
        const special=!!(ct&&ct.status==='Абонемент'&&isAbonementSpecialMonth(c,ct,monthKey(s.date),today));
        const code=String(s.code||'').trim()||'—';
        return {
          date:fmtDate(s.date),
          code,
          desc:s.desc,
          priceVisible:!special,
          price:Number(s.price)||0,
          paidVisible:!special,
          paid:paidOf(s),
          paymentStatus:clientPayLabel(s),
          prepay:prepayOf(s)>0,
          appliedVisible:!special,
          applied:special?[]:appliedItems(s).map(formatAppliedLabel)
        };
      }
    });
  }catch(error){
    console.error('Не удалось сформировать снимок изменений акта',error);
    return null;
  }
}
function offerLink(ct){
  return offerLinkHtml(ct);
}
function contractMeta(ct){
  const parts=[];
  if(ct.status) parts.push(esc(ct.status));
  if(ct.tariff) parts.push(esc(ct.tariff));
  if(Number(ct.discount)) parts.push('скидка '+Number(ct.discount)+'%');
  return parts.join(' · ');
}
function filterToggleTemplate(id){
  const open = !!FILTER_OPEN[id];
  const idAttr=esc(String(id));
  const idArg=esc(JSON.stringify(String(id)));
  return `<button class="filter-toggle" id="filter-toggle-${idAttr}" type="button" aria-expanded="${open?'true':'false'}" aria-controls="filters-${idAttr}" onclick="toggleFilters(${idArg})">${open?'Скрыть фильтры':'Фильтровать'}</button>`;
}
function filtersTemplate(id, f){
  f = f || {};
  const openClass = FILTER_OPEN[id] ? 'open' : '';
  const idAttr=esc(String(id));
  const idArg=esc(JSON.stringify(String(id)));
  return `<div class="filter-box ${openClass}">
    <div class="filter-form ${openClass}" id="filters-${idAttr}">
      <div class="act-filter" data-contract-id="${idAttr}"><label for="filter-from-${idAttr}">Дата с</label><input id="filter-from-${idAttr}" type="text" inputmode="numeric" maxlength="10" autocomplete="off" data-filter="from" value="${esc(f.from||'')}" placeholder="ДД.ММ.ГГГГ"><div class="act-filter-drop hidden"></div></div>
      <div class="act-filter" data-contract-id="${idAttr}"><label for="filter-to-${idAttr}">Дата по</label><input id="filter-to-${idAttr}" type="text" inputmode="numeric" maxlength="10" autocomplete="off" data-filter="to" value="${esc(f.to||'')}" placeholder="ДД.ММ.ГГГГ"><div class="act-filter-drop hidden"></div></div>
      <div class="act-filter" data-contract-id="${idAttr}"><label for="filter-code-${idAttr}">Код услуги</label><input id="filter-code-${idAttr}" type="text" autocomplete="off" data-filter="code" value="${esc(f.code||'')}" placeholder="Все / начните вводить"><div class="act-filter-drop hidden"></div></div>
      <div class="act-filter" data-contract-id="${idAttr}"><label for="filter-pay-${idAttr}">Статус оплаты</label><input id="filter-pay-${idAttr}" type="text" autocomplete="off" data-filter="pay" value="${esc(f.pay||'')}" placeholder="Любой / начните вводить"><div class="act-filter-drop hidden"></div></div>
      <div class="filter-actions"><button class="filter-reset" type="button" onclick="resetFilters(${idArg})">Сбросить</button></div>
    </div>
  </div>`;
}
function getFilters(id){
  const box=document.getElementById('filters-'+id); if(!box) return {};
  const g=k=>box.querySelector(`[data-filter="${k}"]`)?.value.trim()||'';
  return {from:g('from'),to:g('to'),code:g('code'),pay:g('pay')};
}
function filterDateISO(raw){
  const value=String(raw||'').trim();
  if(!value) return '';
  if(/^\d{4}-\d{2}-\d{2}$/.test(value)) return value;
  const parsed=RaleksizCRMCore.parseDateParts ? RaleksizCRMCore.parseDateParts(value) : null;
  return parsed ? parsed.iso : '';
}
const PUBLIC_PAY_FILTER_OPTIONS=['Не оплачено','Оплачено','Оплачено частично','С предоплатой'];
function matchPublicPayFilter(s, raw){
  const q=String(raw||'').trim().toLowerCase();
  if(!q||q==='любой'||q==='все') return true;
  const paid=paidOf(s),price=Number(s.price)||0;
  const isPaid=isPayFull(s)||(price>0&&paid>=price);
  const isNone=!isPaid&&paid<=0;
  const isPart=!isPaid&&paid>0&&paid<price;
  const isPre=prepayOf(s)>0;
  if(q==='none'||q==='неоплачено'||q.includes('не оплач')) return isNone;
  if(q==='partial'||q.includes('частич')) return isPart;
  if(q==='prepay'||q.includes('предоплат')) return isPre;
  if(q==='paid'||q==='оплачено'||q==='оплачено полностью') return isPaid;
  const labels=[];
  if(isNone) labels.push('не оплачено');
  else if(isPart) labels.push('оплачено частично');
  else if(isPaid) labels.push('оплачено');
  if(isPre) labels.push('с предоплатой');
  return labels.some(label=>label.includes(q));
}
function filterServices(list,f){
  const from=filterDateISO(f.from),to=filterDateISO(f.to),code=String(f.code||'').toLowerCase();
  return list.filter(s=>{
    if(from&&(!s.date||s.date<from)) return false;
    if(to&&(!s.date||s.date>to)) return false;
    if(code&&String(s.code||'').toLowerCase().indexOf(code)<0) return false;
    if(!matchPublicPayFilter(s,f.pay)) return false;
    return true;
  });
}
function publicPayLabels(s){
  return PUBLIC_PAY_FILTER_OPTIONS.filter(label=>matchPublicPayFilter(s,label));
}
function uniqueFilterValues(values, key){
  const out=[];
  values.forEach(value=>{
    const s=String(value||'').trim();
    if(s&&!out.some(x=>x.localeCompare(s,'ru',{sensitivity:'accent'})===0)) out.push(s);
  });
  if(key==='from'||key==='to') return out.sort((a,b)=>filterDateISO(a).localeCompare(filterDateISO(b)));
  if(key==='code') return out.sort((a,b)=>a.localeCompare(b,'ru',{numeric:true,sensitivity:'base'}));
  if(key==='pay') return PUBLIC_PAY_FILTER_OPTIONS.filter(label=>out.includes(label));
  return out;
}
function actFilterOptions(id,key){
  if(!CURRENT_CLIENT) return [];
  const ct=getContract(CURRENT_CLIENT,id); if(!ct) return [];
  const f=getFilters(id); f[key]='';
  const values=[];
  filterServices(contractServices(CURRENT_CLIENT,id).filter(s=>isProvided(s)),f).forEach(s=>{
    if((key==='from'||key==='to')&&s.date) values.push(fmtDate(s.date));
    else if(key==='code'&&String(s.code||'').trim()) values.push(String(s.code).trim());
    else if(key==='pay') publicPayLabels(s).forEach(label=>values.push(label));
  });
  return uniqueFilterValues(values,key);
}
function closeActFilterDrops(except){
  document.querySelectorAll('.act-filter-drop').forEach(box=>{
    if(box!==except) box.classList.add('hidden');
  });
}
function actFilterButtons(box){ return box?[...box.querySelectorAll('button[data-val]')]:[]; }
function moveActFilterActive(box,dir){
  const buttons=actFilterButtons(box); if(!buttons.length) return;
  let index=buttons.findIndex(button=>button.classList.contains('active'));
  if(index<0) index=dir>0?0:buttons.length-1;
  else index=Math.max(0,Math.min(buttons.length-1,index+dir));
  buttons.forEach(button=>button.classList.remove('active'));
  buttons[index].classList.add('active');
  buttons[index].scrollIntoView({block:'nearest'});
}
function openActFilterDrop(input,opts){
  const wrap=input.closest('.act-filter'),box=wrap&&wrap.querySelector('.act-filter-drop');
  if(!wrap||!box) return;
  const key=input.dataset.filter,id=wrap.dataset.contractId;
  const typing=opts&&'typed' in opts?!!opts.typed:input.dataset.filterTyping==='1';
  const q=typing?input.value.trim().toLowerCase():'';
  const list=actFilterOptions(id,key);

    const open=box&&!box.classList.contains('hidden');
    if(event.key==='Escape'){ closeActFilterDrops(); input.blur(); return; }
    if(!open) return;
    if(event.key==='ArrowDown'){ event.preventDefault(); moveActFilterActive(box,1); }
    if(event.key==='ArrowUp'){ event.preventDefault(); moveActFilterActive(box,-1); }
    if(event.key==='Enter'){
      const pick=box.querySelector('button.active[data-val]')||box.querySelector('button[data-val]');
      if(pick){ event.preventDefault(); pickActFilterValue(input,pick.dataset.val); }
    }

  document.addEventListener('mousedown',event=>{

    ? CURRENT_ACT_CHANGE_DIFF:null;

function deletedServicesForContract(contractId,filters){
  const diff=actChangeDiff();
  const deleted=diff&&Array.isArray(diff.deletedServices)?diff.deletedServices:[];
  return deleted.filter(service=>String(service.contractId||'')===String(contractId||''))
    .filter(service=>matchDeletedServiceFilter(service,filters||{}));

function matchDeletedServiceFilter(service,f){
  const from=filterDateISO(f.from),to=filterDateISO(f.to);
  const date=String(service&&service.sort&&service.sort.date||'').slice(0,10);
  const code=String(f.code||'').trim().toLowerCase();
  if(from&&(!date||date<from)) return false;
  if(to&&(!date||date>to)) return false;
  if(code&&!String(service&&service.fields&&service.fields.code||'').toLowerCase().includes(code)) return false;
  const q=String(f.pay||'').trim().toLowerCase();
  if(!q||q==='любой'||q==='все') return true;
  const presentation=service&&service.presentation||{};
  const status=String(presentation.paymentStatus||'').toLowerCase();
  const prepay=!!presentation.prepay;
  if(q==='prepay'||q.includes('предоплат')) return prepay;
  if(q==='partial'||q.includes('частич')) return status.includes('частич');
  if(q==='none'||q==='неоплачено'||q.includes('не оплач')) return status.includes('не оплач');
  if(q==='paid'||q==='оплачено'||q==='оплачено полностью') return status==='оплачено';
  return status.includes(q)||(prepay&&'с предоплатой'.includes(q));
}

function bindSyncedHScroll(top, bot){
  if(!top || !bot) return;
  const topInner = top.firstElementChild;
  const syncWidth = () => {
    if(topInner){
      topInner.style.removeProperty('width');
      topInner.style.removeProperty('min-width');
    }
    const overflow = bot.scrollWidth - bot.clientWidth > 2;
    top.classList.toggle('has-x-overflow', overflow);
    bot.classList.toggle('has-x-overflow', overflow);
    if(!overflow){
      top.scrollLeft = 0;
      bot.scrollLeft = 0;
      return;
    }
    const w = bot.scrollWidth;
    if(topInner){
      topInner.style.width = w + 'px';
      topInner.style.minWidth = w + 'px';
    }
    top.scrollLeft = bot.scrollLeft;
  };
  if(!bot.dataset.scrollBound){
    bot.dataset.scrollBound = '1';
    let lock = false;
    top.addEventListener('scroll', () => {
      if(lock) return;
      lock = true;
      bot.scrollLeft = top.scrollLeft;
      lock = false;
    }, {passive:true});
    bot.addEventListener('scroll', () => {
      if(lock) return;
      lock = true;
      top.scrollLeft = bot.scrollLeft;
      lock = false;
    }, {passive:true});
    window.addEventListener('resize', syncWidth);
  }
  requestAnimationFrame(syncWidth);
}

    <div class="comp-formula">Начислено <b>${money(tot.accrued)}</b> = абонентская плата <b>${money(tot.subscriptionDue)}</b> + доплата сверх бюджета договора <b>${money(tot.overage)}</b>.<br>
    Фактически внесено <b>${money(tot.paid)}</b>. Компенсация = начислено − внесено, но не меньше ${money(result.minCompensation||5000)}.</div>
    <div class="comp-total">${money(result.compensation)}</div>
    <div class="muted" style="margin-bottom:8px">Цены в акте выше не переписываются. Здесь — проверка: какой была бы стоимость услуг при фактических платежах и сроке.</div>
    ${months}
  </div>`;
}
function actFooterHtml(){
  return `<div class="act-footer">Вопросы по кодам и условиям — <a class="act-footer-link" href="${BASE_URL}" target="_blank" rel="noopener">Прайс</a> · <a class="act-footer-link" href="https://t.me/aruzlev" target="_blank" rel="noopener">Telegram</a> · <a class="act-footer-link" href="mailto:raleksiz.law@gmail.com">Почта</a></div>`;
}
function renderClient(c,db){
  CURRENT_CLIENT=c; CURRENT_DB=db;
  const root=document.getElementById('root');
  const contracts=(c.contracts||[]).filter(ct=>ct.showInAct!==false).slice();
  const knownContracts=new Set(contracts.map(contract=>String(contract.id)));
  const diff=actChangeDiff();
  const baselineContracts=new Map(((CURRENT_ACT_VIEW_STATE&&CURRENT_ACT_VIEW_STATE.baselineSnapshot&&CURRENT_ACT_VIEW_STATE.baselineSnapshot.contracts)||[])
    .map(contract=>[String(contract.id),contract]));
  ((diff&&diff.deletedServices)||[]).forEach(service=>{
    const contractId=String(service.contractId||'');
    if(!contractId||knownContracts.has(contractId)) return;
    const saved=baselineContracts.get(contractId)||{id:contractId,label:'Договор',basis:'',actMode:'general',sortCreatedAt:''};
    contracts.push({
      id:contractId,
      title:saved.label||'Договор',
      actMode:saved.actMode==='monthly'?'monthly':'general',
      createdAt:saved.sortCreatedAt||'',
      showInAct:true,
      _actSnapshotContract:saved
    });
    knownContracts.add(contractId);
  });
  if(!contracts.length){root.innerHTML=`<div class="client-name">${esc(c.name)}</div><div class="state">Договоров пока нет.</div>`;return;}
  const today=todayISO();
  const grand=contracts.filter(ct=>!ct._actSnapshotContract).reduce((acc,ct)=>{const t=displayContractTotals(c,ct,today);acc.sum+=t.sum;acc.paid+=t.paid;acc.debt+=t.debt;return acc;},{sum:0,paid:0,debt:0});
  const sorted=contracts.slice().sort((a,b)=>String(b.createdAt||'').localeCompare(String(a.createdAt||'')));
  const grandBlock = contracts.length>1
    ? `<div style="margin-top:4px"><h2 style="border-top:none;padding-top:0">Итого по всем договорам</h2><div class="grand-totals">${grandTot('Общая цена услуг',money(grand.sum))}${grandTot('Оплачено',money(grand.paid))}${grandTot('К оплате',money(grand.debt))}</div></div>`
    : '';
  root.innerHTML=`<h1 class="client-name">${esc(c.name)}</h1><div class="muted" style="margin-bottom:16px">Акты оказанных услуг по всем договорам и основаниям</div>${sorted.map(ct=>renderContract(c,ct)).join('')}${grandBlock}${actFooterHtml()}`;
  bindActScrollPairs(root);
  applyActChangeHighlights(root);
}
function applyActChangeHighlights(scope){
  const diff=actChangeDiff();
  if(!diff||!scope) return;
  const newIds=new Set((diff.newServiceIds||[]).map(String));
  scope.querySelectorAll('.svc-row[data-service-id]').forEach(row=>{
    const serviceId=String(row.dataset.serviceId||'');
    if(newIds.has(serviceId)){
      row.classList.add('act-service-new');
      return;
    }
    const changed=diff.changedFieldsByServiceId&&diff.changedFieldsByServiceId[serviceId];
    if(!Array.isArray(changed)||!changed.length) return;
    const keys=new Set(changed.map(String));
    row.querySelectorAll('[data-field-key]').forEach(field=>{
      if(keys.has(String(field.dataset.fieldKey||''))) field.classList.add('act-field-changed');
    });
  });
}
function clearActChangeBanner(){
  const current=document.querySelector('.act-change-banner');
  if(current) current.remove();
  document.body.classList.remove('act-change-banner-open');
  document.body.style.removeProperty('--act-change-banner-height');
}
function syncActChangeBannerSpace(banner){
  if(!banner||!banner.isConnected) return;
  if(window.matchMedia('(max-width:720px)').matches){
    banner.style.removeProperty('left');
    banner.style.removeProperty('top');
    banner.style.removeProperty('right');
    banner.style.removeProperty('bottom');
    document.body.classList.add('act-change-banner-open');
    document.body.style.setProperty('--act-change-banner-height',(Math.ceil(banner.getBoundingClientRect().height)+12)+'px');
  }else{
    document.body.classList.remove('act-change-banner-open');
    document.body.style.removeProperty('--act-change-banner-height');
  }
}
function clampDesktopBanner(banner){
  if(!banner||!banner.isConnected||window.matchMedia('(max-width:720px)').matches) return;
  const rect=banner.getBoundingClientRect();
  if(!banner.style.left&&!banner.style.top) return;
  const left=Math.min(Math.max(8,rect.left),Math.max(8,window.innerWidth-rect.width-8));
  const top=Math.min(Math.max(8,rect.top),Math.max(8,window.innerHeight-rect.height-8));
  banner.style.left=left+'px';
  banner.style.top=top+'px';
  banner.style.right='auto';
  banner.style.bottom='auto';
}
function bindDesktopBannerDrag(banner){
  let drag=null;
  const finish=event=>{
    if(!drag) return;
    if(event&&banner.hasPointerCapture&&banner.hasPointerCapture(drag.pointerId)) banner.releasePointerCapture(drag.pointerId);
    drag=null;
    banner.classList.remove('dragging');
  };
  banner.addEventListener('pointerdown',event=>{
    if(window.matchMedia('(max-width:720px)').matches||event.button!==0||event.target.closest('.act-change-banner-close')) return;
    const rect=banner.getBoundingClientRect();
    banner.style.left=rect.left+'px';
    banner.style.top=rect.top+'px';
    banner.style.right='auto';
    banner.style.bottom='auto';
    drag={pointerId:event.pointerId,offsetX:event.clientX-rect.left,offsetY:event.clientY-rect.top};
    banner.classList.add('dragging');
    banner.setPointerCapture(event.pointerId);
    event.preventDefault();
  });
  banner.addEventListener('pointermove',event=>{
    if(!drag||event.pointerId!==drag.pointerId) return;
    const rect=banner.getBoundingClientRect();
    const maxLeft=Math.max(8,window.innerWidth-rect.width-8);
    const maxTop=Math.max(8,window.innerHeight-rect.height-8);
    banner.style.left=Math.min(Math.max(8,event.clientX-drag.offsetX),maxLeft)+'px';
    banner.style.top=Math.min(Math.max(8,event.clientY-drag.offsetY),maxTop)+'px';
  });
  banner.addEventListener('pointerup',finish);
  banner.addEventListener('pointercancel',finish);
}
function showActChangeBanner(){
  clearActChangeBanner();
  const diff=actChangeDiff();
  if(!diff||!diff.hasChanges) return;
  const banner=document.createElement('aside');
  banner.className='act-change-banner';
  banner.setAttribute('role','status');
  banner.innerHTML='<span>Изменения с прошлого просмотра выделены цветом. При следующем открытии они повторно не выделятся.</span><button type="button" class="act-change-banner-close" aria-label="Закрыть сообщение">×</button>';
  const onResize=()=>{
    syncActChangeBannerSpace(banner);
    clampDesktopBanner(banner);
  };
  banner.querySelector('.act-change-banner-close').addEventListener('click',()=>{
    window.removeEventListener('resize',onResize);
    clearActChangeBanner();
  });
  document.body.appendChild(banner);
  bindDesktopBannerDrag(banner);
  window.addEventListener('resize',onResize);
  requestAnimationFrame(()=>syncActChangeBannerSpace(banner));
}
function checkHeaderWrap(){
  const logo = document.querySelector('header.brand img.logo');
  const contacts = document.querySelector('header.brand .contacts');
  if(!logo || !contacts) return;
  const wrapped = contacts.getBoundingClientRect().top > logo.getBoundingClientRect().top + 10;
  contacts.classList.toggle('wrapped', wrapped);
}
(function initActBrandHeader(){
  const header = document.querySelector('header.brand');
  if(!header) return;
  let lastY = 0;
  window.addEventListener('scroll', ()=>{
    const y = window.scrollY || 0;
    if(y > lastY && y > 48) header.classList.add('is-hidden');
    else header.classList.remove('is-hidden');
    lastY = y;
  }, {passive:true});
  window.addEventListener('load', checkHeaderWrap);
  window.addEventListener('resize', checkHeaderWrap);
  checkHeaderWrap();
  setTimeout(checkHeaderWrap, 300);
})();
function waitForActPaint(){
  return new Promise(resolve=>{
    if(typeof requestAnimationFrame==='function') requestAnimationFrame(()=>resolve());
    else setTimeout(resolve,0);
  });
}
const TEST_MODE_FLAG_PREFIX='raleksiz:act:test-mode:v1:';
const TEST_BASELINE_PREFIX='raleksiz:act:test-baseline:v1:';
function initializeActViewMode(token,params){
  const requested=params.get('test')==='1';
  const flagKey=TEST_MODE_FLAG_PREFIX+token;
  const baselineKey=TEST_BASELINE_PREFIX+token;
  const windowMarker='raleksiz-act-test:'+token;
  let stored=false;
  try{
    if(requested){
      sessionStorage.setItem(flagKey,'1');
      sessionStorage.removeItem(baselineKey);
    }
    stored=sessionStorage.getItem(flagKey)==='1';
  }catch(error){
    console.error('Тестовая сессия недоступна в sessionStorage',error);
  }
  if(requested) window.name=windowMarker;
  CURRENT_ACT_MODE=requested||stored||window.name===windowMarker?'test':'client';
  window.CURRENT_ACT_MODE=CURRENT_ACT_MODE;
  if(requested){
    params.delete('test');
    const query=params.toString();
    history.replaceState(history.state,'',location.pathname+(query?'?'+query:'')+location.hash);
  }
}
function testBaselineFor(token,snapshot){
  if(!snapshot) return null;
  const key=TEST_BASELINE_PREFIX+token;
  try{
    const raw=sessionStorage.getItem(key);
    if(raw){
      const saved=JSON.parse(raw);
      if(saved&&saved.schemaVersion===snapshot.schemaVersion) return saved;
    }
    sessionStorage.setItem(key,JSON.stringify(snapshot));
  }catch(error){
    console.error('Не удалось сохранить тестовую базовую версию акта',error);
  }
  return null;
}
function prepareActViewComparison(token,data){
  const engine=window.RaleksizActChanges;
  const snapshot=CURRENT_ACT_SNAPSHOT;
  let state;
  let baseline=null;
  let initialized=false;
  if(CURRENT_ACT_MODE==='test'){
    baseline=testBaselineFor(token,snapshot);
    initialized=!!baseline;
    state={initialized,revision:0,baselineSnapshot:baseline,testMode:true};
  }else{
    state=data&&data.viewState&&typeof data.viewState==='object'
      ? data.viewState
      : {initialized:false,revision:0,baselineSnapshot:null};
    initialized=!!state.initialized;
    baseline=initialized?state.baselineSnapshot:null;
  }
  CURRENT_ACT_VIEW_STATE=state;
  CURRENT_ACT_CHANGE_DIFF=null;
  if(engine&&snapshot&&typeof engine.compareSnapshots==='function'){
    try{
      CURRENT_ACT_CHANGE_DIFF=engine.compareSnapshots(baseline,snapshot);
    }catch(error){
      console.error('Не удалось сравнить версии акта',error);
    }
  }
  window.CURRENT_ACT_VIEW_STATE=CURRENT_ACT_VIEW_STATE;
  window.CURRENT_ACT_CHANGE_DIFF=CURRENT_ACT_CHANGE_DIFF;
}
async function advanceClientActView(token,data){
  if(CURRENT_ACT_MODE==='test') return;
  const snapshot=CURRENT_ACT_SNAPSHOT;
  const state=CURRENT_ACT_VIEW_STATE||{initialized:false,revision:0,baselineSnapshot:null};
  if(!snapshot||!data.serverDataVersion||data.viewStateUnavailable) return;
  if(!snapshot.hasServices&&!state.initialized) return;
  await waitForActPaint();
  try{
    const response=await fetch(ACT_API+'view-state/advance',{
      method:'POST',
      cache:'no-store',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({
        c:token,
        expectedRevision:Number(state.revision)||0,
        serverDataVersion:data.serverDataVersion,
        currentSnapshot:snapshot
      })
    });
    const result=await response.json().catch(()=>null);
    if(response.status===409) return;
    if(!response.ok||!result||result.ok!==true){
      console.error('Не удалось зафиксировать просмотренную версию акта',result);
      return;
    }
    CURRENT_ACT_VIEW_STATE={
      ...state,
      initialized:result.skipped!=='no_services',
      revision:Number(result.revision)||0,
      baselineDataVersion:data.serverDataVersion,
      baselineSnapshot:snapshot
    };
    window.CURRENT_ACT_VIEW_STATE=CURRENT_ACT_VIEW_STATE;
  }catch(error){
    console.error('Не удалось зафиксировать просмотренную версию акта',error);
  }
}
async function loadAndRender(){
  const root=document.getElementById('root');
  const params=new URLSearchParams(location.search),token=params.get('c');
  if(!token){root.innerHTML='<div class="state err">Ссылка недействительна: отсутствует идентификатор.</div>';return;}
  initializeActViewMode(token,params);
  try{
    const res=await fetch(ACT_API+'?c='+encodeURIComponent(token)+'&t='+Date.now(),{cache:'no-store'});
    if(!res.ok && res.status!==404) throw new Error('fetch failed');
    const data=await res.json();
    if(!data || data.ok!==true || !data.client){
      root.innerHTML='<div class="state err">Заказчик не найден. Проверьте ссылку или обратитесь к исполнителю.</div>';
      return;
    }
    const c=data.client;
    c.contracts=Array.isArray(c.contracts)?c.contracts:[];
    c.services=Array.isArray(c.services)?c.services:[];
    const db={ customFields: Array.isArray(data.customFields)?data.customFields:[] };
    CURRENT_CLIENT=c;
    CURRENT_DB=db;
    CURRENT_ACT_SNAPSHOT=buildCurrentActSnapshot(c,db);
    prepareActViewComparison(token,data);
    renderClient(c,db);
    showActChangeBanner();
    await advanceClientActView(token,data);
  }catch(e){console.error(e);root.innerHTML='<div class="state err">Не удалось загрузить данные. Проверьте интернет-соединение и обновите страницу.</div>';}
}
bindActFilters();
loadAndRender();
