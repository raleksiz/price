<html lang="ru">

<style>
*{box-sizing:border-box;margin:0;padding:0;}
:root{--bg:#F4F0FA;--card:#fff;--ink:#2B1A6B;--muted:#888;--line:#E4E5EA;--violet:#7C3AED;--violet-d:#5B21B6;--soft:#F3ECFA;--ok:#16a34a;--warn:#E65100;--bad:#dc2626;--navy:#1F2A44;--ink-soft:#666B73;--purple:#6E3B8C;}
body{font-family:Inter,system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--ink);min-height:100vh;margin:0;padding:0 0 60px;-webkit-text-size-adjust:100%;}
.wrap{max-width:1180px;margin:0 auto;padding:16px 12px 0;}
header.brand{
  background:#FFFFFF;
  border-bottom:3px solid var(--navy);
  padding:18px 20px 12px;
  position:sticky;top:0;z-index:40;
  transition:transform .22s ease;
}
header.brand.is-hidden{transform:translateY(-110%);}
header.brand .brand-row{
  max-width:980px;margin:0 auto;
  display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;
}
header.brand img.logo{height:57px;width:auto;display:block;}
header.brand .contacts{text-align:right;font-size:12px;color:var(--ink-soft);line-height:1.55;}
header.brand .contacts.wrapped{text-align:left;}
header.brand .contacts .name{font-style:italic;font-weight:700;color:var(--navy);font-size:13px;font-family:Montserrat,Arial,sans-serif;}
header.brand .contacts .inn{font-style:italic;}
header.brand .contacts .handles{color:var(--purple);}
.handle-item{display:inline-block;white-space:nowrap;}
.handle-item + .handle-item{margin-left:6px;}
.icon-link{display:inline-flex;align-items:center;gap:4px;color:inherit;text-decoration:none;}
.icon-link .icon-svg{color:#A9ADB6;}
.icon-link:hover{color:var(--navy);}
.icon-link:hover .icon-svg{color:var(--navy);}
.icon-svg{display:block;}
@media (max-width:640px){
  header.brand{padding:14px 14px 10px;}
  header.brand .brand-row{gap:10px;}
  header.brand img.logo{height:46px;}
}
.card{background:var(--card);border-radius:16px;padding:22px 20px;box-shadow:0 8px 32px rgba(80,40,120,.10);margin-bottom:16px;}
.logo{font-family:Montserrat,system-ui,sans-serif;font-weight:800;font-size:16px;letter-spacing:.5px;color:var(--muted);margin-bottom:4px;}
h1{font-size:18px;font-weight:800;margin-bottom:2px;}
h2{font-size:15px;font-weight:700;margin:18px 0 10px;padding-top:14px;border-top:1.5px solid var(--line);}
h2:first-of-type{border-top:none;padding-top:0;}
h3{font-size:13px;font-weight:700;color:#6E3B8C;margin:14px 0 6px;}
.muted{color:var(--muted);font-size:12px;line-height:1.6;}
.state{text-align:center;padding:60px 16px;color:var(--muted);font-size:14px;}
.err{color:var(--bad);}
.client-name{font-size:20px;font-weight:800;margin-bottom:4px;}
.applied{font-size:11.5px;color:#777;margin-top:3px;line-height:1.5;}

.contract-block{border:1.5px solid var(--line);border-radius:14px;padding:16px 16px 8px;margin-bottom:18px;}
.contract-head{
  display:grid;
  grid-template-columns:minmax(0,1fr) auto;
  grid-template-rows:auto auto auto;
  column-gap:10px;row-gap:2px;
  align-items:start;margin-bottom:10px;
}
.contract-head > *{min-width:0;}
.contract-title{grid-column:1;grid-row:1;font-size:15px;font-weight:800;color:var(--ink);}
.contract-meta{grid-column:1;grid-row:2;font-size:12px;color:#666;line-height:1.6;overflow-wrap:anywhere;}
.contract-basis{grid-column:1;grid-row:3;font-size:12px;color:#666;line-height:1.6;overflow-wrap:anywhere;}
.contract-filter-control{grid-column:2;grid-row:3;align-self:end;justify-self:end;}
.contract-meta b{color:var(--ink);}

.pill{display:inline-block;padding:2px 8px;border-radius:20px;font-size:11px;font-weight:700;white-space:nowrap;}
.pill.ok{background:#E9F7EE;color:#1E6B3C;}
.pill.no{background:#FEE2E2;color:#991B1B;}
.pill.part{background:#FFFDE7;color:#7A6000;}
.pill.pre{background:#EDE9FE;color:#5B21B6;}
@media (min-width:721px){
  .svc-row .c-status .pill.part{
    white-space:normal;
    line-height:1.25;
    max-width:100%;
    box-sizing:border-box;
  }
  .svc-row .c-status .pill.part .part-rest{display:block;}
}

.svc-scroll,
.svc-head-scroll,
.svc-body-scroll{
  display:block;width:100%;max-width:100%;min-width:0;
  overflow-y:hidden;
  -webkit-overflow-scrolling:touch;
}
.svc-scroll{overflow-x:auto;}
.svc-head-scroll,.svc-body-scroll{overflow-x:hidden;}
.svc-head-scroll.has-x-overflow,.svc-body-scroll.has-x-overflow{overflow-x:auto;}
.svc-head-scroll{background:#fff;}
.svc-head-scroll::-webkit-scrollbar,
.svc-body-scroll::-webkit-scrollbar,
.svc-scroll::-webkit-scrollbar{height:8px;}
.svc-head-scroll,
.svc-body-scroll,
.svc-scroll{scrollbar-width:thin;}
.svc-scroll-inner{width:100%;min-width:0;}
.svc-list{display:flex;flex-direction:column;overflow-x:visible;width:100%;}
.contract-block{min-width:0;max-width:100%;overflow:hidden;}
.svc-head{
  display:grid;
  grid-template-columns:28px 90px 55px minmax(215px,1fr) 90px 90px 150px;
  gap:8px;padding:0 6px 6px;
  font-size:10px;text-transform:uppercase;letter-spacing:.3px;color:var(--muted);
  border-bottom:1.5px solid var(--line);
  min-width:0;
}
.svc-head > div:nth-child(5),.svc-head > div:nth-child(6){text-align:left;justify-self:start;}
.svc-row{
  display:grid;
  grid-template-columns:28px 90px 55px minmax(215px,1fr) 90px 90px 150px;
  grid-template-areas:"num date code desc price paid status";
  align-items:center;gap:8px;padding:9px 6px;border-bottom:1px solid #F0F0F3;font-size:13px;
  min-width:0;
}
.svc-row .c-num{grid-area:num;color:#888;font-variant-numeric:tabular-nums;}
.svc-row .c-date{grid-area:date;white-space:nowrap;}
.svc-row .c-code{grid-area:code;white-space:nowrap;}
.svc-row .c-desc{grid-area:desc;overflow-wrap:anywhere;word-break:break-word;}
.svc-row .c-price{grid-area:price;text-align:left;justify-self:start;font-variant-numeric:tabular-nums;white-space:nowrap;}
.svc-row .c-paid{grid-area:paid;text-align:left;justify-self:start;font-variant-numeric:tabular-nums;white-space:nowrap;}
.svc-row .c-status{grid-area:status;white-space:normal;text-align:left;}
.svc-row .c-status .pay-stack{display:flex;flex-direction:column;gap:3px;align-items:flex-start;}
.svc-row .c-codedesc,.svc-row .c-priceinfo{display:none;}

.svc-head.abon-special,
.svc-row.abon-special{
  grid-template-columns:28px 90px 55px minmax(215px,1fr) 150px;
  grid-template-areas:"num date code desc status";
}
.svc-row.abon-special .c-price,
.svc-row.abon-special .c-paid{display:none !important;}
.svc-row.abon-special .c-priceinfo{display:none;}

@media (max-width:720px){
  .card,.wrap{min-width:0;max-width:100%;}
  .svc-scroll-inner{
    width:max(100%, 780px);
    min-width:780px;
    max-width:none;
  }
  .svc-head,
  .svc-list,
  .svc-row{
    width:100%;
    box-sizing:border-box;
  }
  .svc-head{display:grid;}
  .svc-row .c-date::before{content:none;}
  .svc-row .c-codedesc,
  .svc-row .c-priceinfo{display:none;}
  .svc-row .c-code,
  .svc-row .c-desc,
  .svc-row .c-price,
  .svc-row .c-paid,
  .svc-row .c-status{display:block;}
  .svc-row.abon-special .c-price,
  .svc-row.abon-special .c-paid{display:none !important;}
}

.comp-block{margin-top:18px;padding-top:14px;border-top:1.5px solid var(--line);min-width:0;max-width:100%;}
.comp-block h2{font-size:16px;margin:0 0 8px;}
.comp-formula{font-size:13px;line-height:1.6;margin-bottom:10px;}
.comp-formula b{font-variant-numeric:tabular-nums;}
.comp-month{background:var(--soft);border-radius:10px;padding:10px 12px;margin:10px 0;width:100%;max-width:100%;min-width:0;overflow:hidden;box-sizing:border-box;}
.comp-month h3{margin:0 0 6px;font-size:14px;text-transform:none;letter-spacing:0;}
.comp-svc-scroll,
.comp-svc-head-scroll,
.comp-svc-body-scroll{
  display:block;width:100%;max-width:100%;min-width:0;
  overflow-y:hidden;
  -webkit-overflow-scrolling:touch;
}
.comp-svc-scroll{overflow-x:auto;}
.comp-svc-head-scroll,.comp-svc-body-scroll{overflow-x:hidden;}
.comp-svc-head-scroll.has-x-overflow,.comp-svc-body-scroll.has-x-overflow{overflow-x:auto;}
.comp-svc-scroll,
.comp-svc-head-scroll{margin-top:8px;}
.comp-svc-body-scroll{margin-top:0;}
.comp-svc-head-scroll{background:#fff;}
.comp-svc-head-scroll::-webkit-scrollbar,
.comp-svc-body-scroll::-webkit-scrollbar,
.comp-svc-scroll::-webkit-scrollbar{height:8px;}
.comp-svc-head-scroll,
.comp-svc-body-scroll,
.comp-svc-scroll{scrollbar-width:thin;}
.comp-svc{width:max-content;min-width:740px;border-collapse:collapse;font-size:12px;margin:0;table-layout:fixed;}
.comp-svc th,.comp-svc td{padding:5px 8px;border-bottom:1px solid #e8e4f4;text-align:left;vertical-align:top;}
.comp-svc th{font-size:10.5px;font-weight:700;text-transform:none;color:#6E3B8C;white-space:normal;line-height:1.25;letter-spacing:0;}
.comp-col-date{width:104px;}
.comp-col-code{width:56px;}
.comp-col-desc{width:240px;}
.comp-col-num{width:108px;}
@media (min-width:721px){
  .comp-svc{width:100%;min-width:740px;}
  .comp-col-desc{width:auto;}
}
.comp-svc-date,.comp-svc-code,
.comp-svc th:nth-child(1),.comp-svc th:nth-child(2){
  white-space:nowrap;overflow:hidden;
}
.comp-svc-desc{white-space:normal;overflow-wrap:anywhere;word-break:break-word;line-height:1.35;}
.comp-svc .num{text-align:right;font-variant-numeric:tabular-nums;}
.comp-svc td.num{white-space:nowrap;}
.comp-up{color:#b42318;font-weight:700;}
.comp-down{color:#167c3a;font-weight:700;}
.comp-same{color:#777;}
.comp-total{font-size:20px;font-weight:800;margin:8px 0 10px;font-variant-numeric:tabular-nums;}
.mtot{font-size:12px;color:#666;margin:4px 0 4px;padding-left:2px;}

.totals{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px;}
.tot{background:var(--soft);border-radius:10px;padding:7px 9px;min-width:0;flex:1 1 0;text-align:center;}
.tot .l{font-size:9px;text-transform:uppercase;color:#6E3B8C;font-weight:700;letter-spacing:.3px;white-space:nowrap;}
.tot .v{font-size:13px;font-weight:800;margin-top:1px;font-variant-numeric:tabular-nums;}
@media (max-width:720px){
  .totals{flex-wrap:nowrap;gap:6px;}
  .totals .tot{padding:6px 5px;}
  .totals .tot:first-child{flex:1.6 1 0;}
  .totals .tot:not(:first-child){flex:0.85 1 0;}
  .totals .tot .l{font-size:8.3px;}
  .totals .tot .v{font-size:12px;}
}
@media (max-width:480px){
  .totals{gap:5px;}
  .totals .tot{padding:6px 4px;}
  .totals .tot .l{font-size:7.3px;}
  .totals .tot .v{font-size:11.5px;}
}

.grand-totals{display:flex;gap:12px;flex-wrap:wrap;margin-top:8px;}
.grand-tot{background:var(--soft);border-radius:10px;padding:12px 16px;min-width:150px;flex:1;border:1.5px solid #C4B5FD;}
.grand-tot .l{font-size:10.5px;text-transform:uppercase;color:#6E3B8C;font-weight:700;letter-spacing:.3px;}
.grand-tot .v{font-size:18px;font-weight:800;margin-top:3px;font-variant-numeric:tabular-nums;}
@media (max-width:720px){
  .grand-totals{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:5px;flex-wrap:nowrap;}
  .grand-tot{padding:6px 4px;min-width:0;width:100%;text-align:center;}
  .grand-tot .l{font-size:7.3px;white-space:nowrap;letter-spacing:0;}
  .grand-tot .v{font-size:11.5px;margin-top:2px;}
}
@media (max-width:480px){
  .grand-totals{gap:4px;}
  .grand-tot{padding:5px 3px;}
  .grand-tot .l{font-size:6.8px;}
  .grand-tot .v{font-size:11px;}
}

.act-footer{
  margin-top:16px;
  font-size:12px;
  color:var(--muted);
  line-height:1.6;
}
.act-footer-link{
  color:var(--violet);
  text-decoration:none;
  font-weight:600;
}
.act-footer-link:hover{text-decoration:underline;}

.filter-box{display:none;margin:0 0 12px;padding:10px 12px;background:#F8F6FF;border:1px solid #E7DFF7;border-radius:10px;}
.filter-box.open{display:block;}
.filter-toggle{width:auto;height:36px;white-space:nowrap;border:1px solid #C4B5FD;background:#fff;color:#6E3B8C;border-radius:8px;padding:7px 10px;font:600 12px inherit;cursor:pointer;}
.filter-form{display:none;margin-top:0;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;align-items:end;}
.filter-form.open{display:grid;}
.filter-form label{display:block;font-size:9px;text-transform:uppercase;color:#888;font-weight:700;margin-bottom:4px;}
.filter-form input,.filter-form select{width:100%;border:1px solid #DDD;border-radius:7px;padding:7px 8px;font:12px inherit;color:var(--ink);background:#fff;min-width:0;}
@media(max-width:720px){
  .filter-form label{font-size:10px;}
  .filter-form input,.filter-form select{font-size:11px;padding:6px 7px;}
  .filter-toggle{height:40px;font-size:11px;padding:6px 9px;}
}
.filter-actions{display:flex;gap:6px;}
.filter-actions button{border:0;border-radius:7px;padding:7px 10px;font:600 12px inherit;cursor:pointer;}
.filter-apply{background:var(--ink);color:#fff;}.filter-reset{background:#eee;color:#555;}
.applied-box{margin-top:6px;padding:7px 9px;background:#F8F6FF;border-radius:8px;color:#666;font-size:11px;line-height:1.55;}
.applied-box summary{cursor:pointer;color:#6E3B8C;font-weight:700;list-style:none;}
.applied-box summary::-webkit-details-marker{display:none;}
.applied-box summary:before{content:'▸';margin-right:5px;}.applied-box[open] summary:before{content:'▾';}
.applied-list{margin:5px 0 0 18px;padding:0;}.applied-list li{margin:2px 0;overflow-wrap:anywhere;}
.cf-public-list{margin-top:7px;padding-top:7px;border-top:1px solid #F0F0F3;font-size:11.5px;line-height:1.55;}
.cf-public-item{margin:4px 0;overflow-wrap:anywhere;}.cf-public-item b{color:var(--ink);}
.cf-public-item ul{margin:4px 0 4px 18px;padding:0;}.cf-public-item li{margin:2px 0;}
@media (min-width:721px){
  .svc-row .c-desc,
  .cf-public-list,
  .cf-public-item,
  .cf-public-item ul,
  .cf-public-item li{
    min-width:0;
    max-width:100%;
    overflow-wrap:anywhere;
    word-break:break-word;

.offer-link{color:var(--violet);font-weight:700;text-decoration:none;}.offer-link:hover{text-decoration:underline;}
.empty-filter{padding:10px 4px;color:#888;font-size:12px;}
@media(max-width:720px){
  .filter-form.open{display:grid;grid-template-columns:1fr 1fr;}
  .filter-actions{grid-column:1/-1;}

</style>

<script>
const ACT_API  = 'https://act.raleksiz-law.workers.dev/';
const BASE_URL = 'https://raleksiz.github.io/price/';
const MONTHS = ['январь','февраль','март','апрель','май','июнь','июль','август','сентябрь','октябрь','ноябрь','декабрь'];
const {
  escapeHtml: esc,
  safeHttpUrl,
  paidOf,
  prepayOf,
  cashPaidOf,
  paidForAbonementMonth
} = RaleksizCRMCore;

function money(n){ return Math.round(Number(n)||0).toLocaleString('ru-RU') + ' ₽'; }
function fmtDate(iso){ if(!iso) return ''; const p=String(iso).split('-'); return p.length===3?`${p[2]}.${p[1]}.${p[0]}`:String(iso); }
function monthKey(iso){ return iso?String(iso).slice(0,7):''; }
function monthTitle(mk){
  if(!mk) return '';
  const [y,m]=mk.split('-');
  const month=MONTHS[Number(m)-1]||'';
  return month ? month.charAt(0).toUpperCase()+month.slice(1)+' '+y+' года' : '';
}
function monthTitleInText(mk){
  const title=monthTitle(mk);
  return title ? title.charAt(0).toLowerCase()+title.slice(1) : '';
}
function isComplete(s){ return !!(s&&s.date&&String(s.desc||'').trim()); }
function isProvided(s,today){ return isComplete(s) && String(s.date).slice(0,10)<=(today||todayISO()); }
function isPayFull(s){ return !!(s&&(s.pay==='full'||s.pay==='full_prepay')); }
function todayISO(){
  const d=new Date();
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
}
function monthLastISO(month){
  const y=Number(String(month).slice(0,4)), m=Number(String(month).slice(5,7));
  const last=new Date(y, m, 0).getDate();
  return String(month).slice(0,7)+'-'+String(last).padStart(2,'0');
}
function reportingPeriod(month, today){
  today = today || todayISO();
  month = String(month||'').slice(0,7);
  if(!month) return {start:'', end:'', empty:true};
  const start = month+'-01';
  const last = monthLastISO(month);
  if(today < start) return {start, end:start, empty:true};
  return {start, end: today < last ? today : last, empty:false};
}
function contractPriceForMonth(ct, month){
  month = String(month||'').slice(0,7);
  if(ct && ct.contractPriceSnapshots && ct.contractPriceSnapshots[month]!=null) return Number(ct.contractPriceSnapshots[month])||0;
  return Number(ct && ct.contractPrice)||0;
}
function servicesInReportingMonth(c, ct, month, today){
  const p = reportingPeriod(month, today);
  if(p.empty) return [];
  return contractServices(c, ct.id).filter(s=>isProvided(s, today) && s.date>=p.start && s.date<=p.end);
}
function isAbonementSpecialMonth(c, ct, month, today){
  if(!ct || ct.status!=='Абонемент') return false;
  const p = reportingPeriod(month, today);
  if(p.empty) return false;
  const budget = contractPriceForMonth(ct, month);
  if(!(budget>0)) return false;
  const actual = servicesInReportingMonth(c, ct, month, today).reduce((a,s)=>a+(Number(s.price)||0),0);
  return actual < budget;
}
function displayPaidForMonth(ct, month, services, special){
  const list=(services||[]).filter(s=>monthKey(s&&s.date)===month);
  if(!special || !ct || ct.status!=='Абонемент') return list.reduce((sum,s)=>sum+paidOf(s),0);

  const paid=paidForAbonementMonth(list, month);
  const prepayServices=list.filter(s=>s&&(s.pay==='full_prepay'||s.pay==='part_prepay'));
  const hasActualPrepay=prepayServices.some(s=>s.actualPrepay!=null&&s.actualPrepay!=='');
  if(!prepayServices.length||hasActualPrepay) return paid;

function filterServices(list,f){
  return list.filter(s=>{
    if(f.from&&(!s.date||s.date<f.from)) return false;
    if(f.to&&(!s.date||s.date>f.to)) return false;
    if(f.code&&String(s.code||'').toLowerCase().indexOf(f.code)<0) return false;
    const paid=paidOf(s),price=Number(s.price)||0;
    if(f.pay==='none'&&(paid>0||isPayFull(s))) return false;
    if(f.pay==='paid'&&!(isPayFull(s)||(price>0&&paid>=price))) return false;
    if(f.pay==='partial'&&!(paid>0&&paid<price)) return false;
    if(f.pay==='prepay'&&prepayOf(s)<=0) return false;
    return true;
  });

function bindSyncedHScroll(top, bot){
  if(!top || !bot) return;
  const topInner = top.firstElementChild;
  const syncWidth = () => {
    if(topInner){
      topInner.style.removeProperty('width');
      topInner.style.removeProperty('min-width');
    }
    const overflow = bot.scrollWidth - bot.clientWidth > 2;
    top.classList.toggle('has-x-overflow', overflow);
    bot.classList.toggle('has-x-overflow', overflow);
    if(!overflow){
      top.scrollLeft = 0;
      bot.scrollLeft = 0;
      return;
    }
    const w = bot.scrollWidth;
    if(topInner){
      topInner.style.width = w + 'px';
      topInner.style.minWidth = w + 'px';
    }
    top.scrollLeft = bot.scrollLeft;
  };
  if(!bot.dataset.scrollBound){
    bot.dataset.scrollBound = '1';
    let lock = false;
    top.addEventListener('scroll', () => {
      if(lock) return;
      lock = true;
      bot.scrollLeft = top.scrollLeft;
      lock = false;
    }, {passive:true});
    bot.addEventListener('scroll', () => {
      if(lock) return;
      lock = true;
      top.scrollLeft = bot.scrollLeft;
      lock = false;
    }, {passive:true});
    window.addEventListener('resize', syncWidth);
  }
  requestAnimationFrame(syncWidth);
}

    </section>`;
  }).join('');
  return `<div class="comp-block">
    <h2>${esc(clause)}</h2>
    <div class="comp-formula">Начислено <b>${money(tot.accrued)}</b> = абонентская плата <b>${money(tot.subscriptionDue)}</b> + доплата сверх бюджета договора <b>${money(tot.overage)}</b>.<br>
    Фактически внесено <b>${money(tot.paid)}</b>. Компенсация = начислено − внесено, но не меньше ${money(result.minCompensation||5000)}.</div>
    <div class="comp-total">${money(result.compensation)}</div>
    <div class="muted" style="margin-bottom:8px">Цены в акте выше не переписываются. Здесь — проверка: какой была бы стоимость услуг при фактических платежах и сроке.</div>
    ${months}
  </div>`;
}
function actFooterHtml(){
  return `<div class="act-footer">Вопросы по кодам и условиям — <a class="act-footer-link" href="${BASE_URL}" target="_blank" rel="noopener">Прайс</a> · <a class="act-footer-link" href="https://t.me/aruzlev" target="_blank" rel="noopener">Telegram</a> · <a class="act-footer-link" href="mailto:raleksiz.law@gmail.com">Почта</a></div>`;
}
function renderClient(c,db){
  CURRENT_CLIENT=c; CURRENT_DB=db;
  const root=document.getElementById('root');
  const contracts=(c.contracts||[]).filter(ct=>ct.showInAct!==false);
  if(!contracts.length){root.innerHTML=`<div class="client-name">${esc(c.name)}</div><div class="state">Договоров пока нет.</div>`;return;}
  const today=todayISO();
  const grand=contracts.reduce((acc,ct)=>{const t=displayContractTotals(c,ct,today);acc.sum+=t.sum;acc.paid+=t.paid;acc.debt+=t.debt;return acc;},{sum:0,paid:0,debt:0});
  const sorted=contracts.slice().sort((a,b)=>String(b.createdAt||'').localeCompare(String(a.createdAt||'')));
  const grandBlock = contracts.length>1
    ? `<div style="margin-top:4px"><h2 style="border-top:none;padding-top:0">Итого по всем договорам</h2><div class="grand-totals">${grandTot('Общая цена услуг',money(grand.sum))}${grandTot('Оплачено',money(grand.paid))}${grandTot('К оплате',money(grand.debt))}</div></div>`
    : '';
  root.innerHTML=`<h1 class="client-name">${esc(c.name)}</h1><div class="muted" style="margin-bottom:16px">Акты оказанных услуг по всем договорам и основаниям</div>${sorted.map(ct=>renderContract(c,ct)).join('')}${grandBlock}${actFooterHtml()}`;
  bindActScrollPairs(root);
}
function checkHeaderWrap(){
  const logo = document.querySelector('header.brand img.logo');
  const contacts = document.querySelector('header.brand .contacts');
  if(!logo || !contacts) return;
  const wrapped = contacts.getBoundingClientRect().top > logo.getBoundingClientRect().top + 10;
  contacts.classList.toggle('wrapped', wrapped);
}
(function initActBrandHeader(){
  const header = document.querySelector('header.brand');
  if(!header) return;
  let lastY = 0;
  window.addEventListener('scroll', ()=>{
    const y = window.scrollY || 0;
    if(y > lastY && y > 48) header.classList.add('is-hidden');
    else header.classList.remove('is-hidden');
    lastY = y;
  }, {passive:true});
  window.addEventListener('load', checkHeaderWrap);
  window.addEventListener('resize', checkHeaderWrap);
  checkHeaderWrap();
  setTimeout(checkHeaderWrap, 300);
})();
async function loadAndRender(){
  const root=document.getElementById('root');
  const params=new URLSearchParams(location.search),token=params.get('c');
  if(!token){root.innerHTML='<div class="state err">Ссылка недействительна: отсутствует идентификатор.</div>';return;}
  try{
    const res=await fetch(ACT_API+'?c='+encodeURIComponent(token)+'&t='+Date.now(),{cache:'no-store'});
    if(!res.ok && res.status!==404) throw new Error('fetch failed');
    const data=await res.json();
    if(!data || data.ok!==true || !data.client){
      root.innerHTML='<div class="state err">Заказчик не найден. Проверьте ссылку или обратитесь к исполнителю.</div>';
      return;
    }
    const c=data.client;
    c.contracts=Array.isArray(c.contracts)?c.contracts:[];
    c.services=Array.isArray(c.services)?c.services:[];
    const db={ customFields: Array.isArray(data.customFields)?data.customFields:[] };
    renderClient(c,db);
  }catch(e){console.error(e);root.innerHTML='<div class="state err">Не удалось загрузить данные. Проверьте интернет-соединение и обновите страницу.</div>';}
}
loadAndRender();
</script>
