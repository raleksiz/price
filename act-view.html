<style>
*{box-sizing:border-box;margin:0;padding:0;}
:root{--bg:#F4F0FA;--card:#fff;--ink:#2B1A6B;--muted:#888;--line:#E4E5EA;--violet:#7C3AED;--violet-d:#5B21B6;--soft:#F3ECFA;--ok:#16a34a;--warn:#E65100;--bad:#dc2626;}
body{font-family:Inter,system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--ink);min-height:100vh;padding:16px 12px 60px;-webkit-text-size-adjust:100%;}
.wrap{max-width:1180px;margin:0 auto;}
.card{background:var(--card);border-radius:16px;padding:22px 20px;box-shadow:0 8px 32px rgba(80,40,120,.10);margin-bottom:16px;}
.logo{font-family:Montserrat,system-ui,sans-serif;font-weight:800;font-size:16px;letter-spacing:.5px;color:var(--muted);margin-bottom:4px;}
h1{font-size:18px;font-weight:800;margin-bottom:2px;}
h2{font-size:15px;font-weight:700;margin:18px 0 10px;padding-top:14px;border-top:1.5px solid var(--line);}
h2:first-of-type{border-top:none;padding-top:0;}
h3{font-size:13px;font-weight:700;color:#6E3B8C;margin:14px 0 6px;}
.muted{color:var(--muted);font-size:12px;line-height:1.6;}
.state{text-align:center;padding:60px 16px;color:var(--muted);font-size:14px;}
.err{color:var(--bad);}
.client-name{font-size:20px;font-weight:800;margin-bottom:4px;}
.applied{font-size:11.5px;color:#777;margin-top:3px;line-height:1.5;}

.contract-block{border:1.5px solid var(--line);border-radius:14px;padding:16px 16px 8px;margin-bottom:18px;}
.contract-head{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:10px;}
.contract-title{font-size:15px;font-weight:800;color:var(--ink);}
.contract-meta{font-size:12px;color:#666;line-height:1.6;margin-top:2px;}
.contract-meta b{color:var(--ink);}

.pill{display:inline-block;padding:2px 8px;border-radius:20px;font-size:11px;font-weight:700;white-space:nowrap;}
.pill.ok{background:#E9F7EE;color:#1E6B3C;}
.pill.no{background:#FEE2E2;color:#991B1B;}
.pill.part{background:#FFFDE7;color:#7A6000;}
.pill.pre{background:#EDE9FE;color:#5B21B6;}
.svc-row .c-status .pill.part{
  white-space:normal;
  line-height:1.25;
  max-width:100%;
  box-sizing:border-box;
}

.svc-list{display:flex;flex-direction:column;overflow-x:visible;width:100%;}
.svc-head{
  display:grid;
  grid-template-columns:28px 90px 55px minmax(215px,1fr) 90px 90px 150px;
  gap:8px;padding:0 6px 6px;
  font-size:10px;text-transform:uppercase;letter-spacing:.3px;color:var(--muted);
  border-bottom:1.5px solid var(--line);
  min-width:0;
}
.svc-head > div:nth-child(5),.svc-head > div:nth-child(6){text-align:left;justify-self:start;}
.svc-row{
  display:grid;
  grid-template-columns:28px 90px 55px minmax(215px,1fr) 90px 90px 150px;
  grid-template-areas:"num date code desc price paid status";
  align-items:center;gap:8px;padding:9px 6px;border-bottom:1px solid #F0F0F3;font-size:13px;
  min-width:0;
}
.svc-row .c-num{grid-area:num;color:#888;font-variant-numeric:tabular-nums;}
.svc-row .c-date{grid-area:date;white-space:nowrap;}
.svc-row .c-code{grid-area:code;white-space:nowrap;}
.svc-row .c-desc{grid-area:desc;overflow-wrap:anywhere;word-break:break-word;}
.svc-row .c-price{grid-area:price;text-align:left;justify-self:start;font-variant-numeric:tabular-nums;white-space:nowrap;}
.svc-row .c-paid{grid-area:paid;text-align:left;justify-self:start;font-variant-numeric:tabular-nums;white-space:nowrap;}
.svc-row .c-status{grid-area:status;white-space:normal;text-align:left;}
.svc-row .c-status .pay-stack{display:flex;flex-direction:column;gap:3px;align-items:flex-start;}
.svc-row .c-codedesc,.svc-row .c-priceinfo{display:none;}

.svc-head.abon-special,
.svc-row.abon-special{
  grid-template-columns:28px 90px 55px minmax(215px,1fr) 150px;
  grid-template-areas:"num date code desc status";
}
.svc-row.abon-special .c-price,
.svc-row.abon-special .c-paid{display:none !important;}
.svc-row.abon-special .c-priceinfo{display:none;}

@media (max-width:720px){
  .svc-head{display:none;}
  .svc-list{overflow-x:visible;}
  .svc-row{
    display:grid;
    grid-template-columns:22px 1fr;
    grid-template-areas:
      "num date"
      "num codedesc"
      "num priceinfo";
    row-gap:4px;padding:10px 4px;
    min-width:0;
    width:100%;
  }
  .svc-row.abon-special{
    grid-template-columns:22px 1fr;
    grid-template-areas:
      "num date"
      "num codedesc"
      "num priceinfo";
  }
  .svc-row .c-date{grid-area:date;}
  .svc-row .c-date::before{content:"Дата оказания услуги: ";color:#aaa;font-weight:400;}
  .svc-row .c-code,.svc-row .c-desc,.svc-row .c-price,.svc-row .c-paid,.svc-row .c-status{display:none;}
  .svc-row .c-codedesc{grid-area:codedesc;display:block;overflow-wrap:anywhere;word-break:break-word;line-height:1.5;min-width:0;width:100%;}
  .svc-row .c-priceinfo{grid-area:priceinfo;display:flex;flex-wrap:nowrap;align-items:center;gap:6px;font-size:12.5px;overflow-x:auto;white-space:nowrap;}
  .svc-row.abon-special .c-priceinfo{display:flex;}
  .svc-row .c-priceinfo .price-main{font-weight:700;white-space:nowrap;}
  .svc-row .c-priceinfo .paid-amt{white-space:nowrap;color:#666;}
  .svc-row .c-priceinfo .pill{white-space:nowrap;}
  .svc-row .c-priceinfo .pay-stack{display:inline-flex;flex-direction:row;flex-wrap:nowrap;gap:6px;align-items:center;}
}

.mtot{font-size:12px;color:#666;margin:4px 0 4px;padding-left:2px;}

.totals{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px;}
.tot{background:var(--soft);border-radius:10px;padding:7px 9px;min-width:0;flex:1 1 0;text-align:center;}
.tot .l{font-size:9px;text-transform:uppercase;color:#6E3B8C;font-weight:700;letter-spacing:.3px;white-space:nowrap;}
.tot .v{font-size:13px;font-weight:800;margin-top:1px;font-variant-numeric:tabular-nums;}
@media (max-width:720px){
  .totals{flex-wrap:nowrap;gap:6px;}
  .totals .tot{padding:6px 5px;}
  .totals .tot:first-child{flex:1.6 1 0;}
  .totals .tot:not(:first-child){flex:0.85 1 0;}
  .totals .tot .l{font-size:8.3px;}
  .totals .tot .v{font-size:12px;}
}
@media (max-width:480px){
  .totals{gap:5px;}
  .totals .tot{padding:6px 4px;}
  .totals .tot .l{font-size:7.3px;}
  .totals .tot .v{font-size:11.5px;}
}

.grand-totals{display:flex;gap:12px;flex-wrap:wrap;margin-top:8px;}
.grand-tot{background:var(--soft);border-radius:10px;padding:12px 16px;min-width:150px;flex:1;border:1.5px solid #C4B5FD;}
.grand-tot .l{font-size:10.5px;text-transform:uppercase;color:#6E3B8C;font-weight:700;letter-spacing:.3px;}
.grand-tot .v{font-size:18px;font-weight:800;margin-top:3px;font-variant-numeric:tabular-nums;}
@media (max-width:720px){
  .grand-totals{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:5px;flex-wrap:nowrap;}
  .grand-tot{padding:6px 4px;min-width:0;width:100%;text-align:center;}
  .grand-tot .l{font-size:7.3px;white-space:nowrap;letter-spacing:0;}
  .grand-tot .v{font-size:11.5px;margin-top:2px;}
}
@media (max-width:480px){
  .grand-totals{gap:4px;}
  .grand-tot{padding:5px 3px;}
  .grand-tot .l{font-size:6.8px;}
  .grand-tot .v{font-size:11px;}
}

.filter-box{margin:10px 0 12px;padding:10px 12px;background:#F8F6FF;border:1px solid #E7DFF7;border-radius:10px;}
.filter-toggle{border:1px solid #C4B5FD;background:#fff;color:#6E3B8C;border-radius:8px;padding:7px 10px;font:600 12px inherit;cursor:pointer;}
.filter-form{display:none;margin-top:10px;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;align-items:end;}
.filter-form.open{display:grid;}
.filter-form label{display:block;font-size:9px;text-transform:uppercase;color:#888;font-weight:700;margin-bottom:4px;}
.filter-form input,.filter-form select{width:100%;border:1px solid #DDD;border-radius:7px;padding:7px 8px;font:12px inherit;color:var(--ink);background:#fff;min-width:0;}
@media(max-width:720px){
  .filter-form label{font-size:10px;}
  .filter-form input,.filter-form select{font-size:11px;padding:6px 7px;}
  .filter-toggle{font-size:11px;padding:6px 9px;}
}
.filter-actions{display:flex;gap:6px;}
.filter-actions button{border:0;border-radius:7px;padding:7px 10px;font:600 12px inherit;cursor:pointer;}
.filter-apply{background:var(--ink);color:#fff;}.filter-reset{background:#eee;color:#555;}
.applied-box{margin-top:6px;padding:7px 9px;background:#F8F6FF;border-radius:8px;color:#666;font-size:11px;line-height:1.55;}
.applied-box summary{cursor:pointer;color:#6E3B8C;font-weight:700;list-style:none;}
.applied-box summary::-webkit-details-marker{display:none;}
.applied-box summary:before{content:'▸';margin-right:5px;}.applied-box[open] summary:before{content:'▾';}
.applied-list{margin:5px 0 0 18px;padding:0;}.applied-list li{margin:2px 0;overflow-wrap:anywhere;}
.cf-public-list{margin-top:7px;padding-top:7px;border-top:1px solid #F0F0F3;font-size:11.5px;line-height:1.55;}
.cf-public-item{margin:4px 0;overflow-wrap:anywhere;}.cf-public-item b{color:var(--ink);}
.cf-public-item ul{margin:4px 0 4px 18px;padding:0;}.cf-public-item li{margin:2px 0;}
.offer-link{color:var(--violet);font-weight:700;text-decoration:none;}.offer-link:hover{text-decoration:underline;}
.empty-filter{padding:10px 4px;color:#888;font-size:12px;}
@media(max-width:720px){
  .filter-form.open{display:grid;grid-template-columns:1fr 1fr;}
  .filter-actions{grid-column:1/-1;}
  .contract-block{padding:13px 12px 8px;}
}
@media(max-width:430px){.filter-form.open{grid-template-columns:1fr;}.filter-actions{grid-column:auto;}}

<body>
<div class="wrap">
  <div class="card" id="root">
    <div class="state">Загрузка…</div>
  </div>
</div>

<script src="calculator.js"></script>
<script>
const ACT_API  = 'https://act.raleksiz-law.workers.dev/';
const BASE_URL = 'https://raleksiz.github.io/price/';
const MONTHS = ['январь','февраль','март','апрель','май','июнь','июль','август','сентябрь','октябрь','ноябрь','декабрь'];

function esc(s){ return String(s??'').replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function money(n){ return Math.round(Number(n)||0).toLocaleString('ru-RU') + ' ₽'; }
function fmtDate(iso){ if(!iso) return ''; const p=String(iso).split('-'); return p.length===3?`${p[2]}.${p[1]}.${p[0]}`:String(iso); }
function monthKey(iso){ return iso?String(iso).slice(0,7):''; }
function monthTitle(mk){ if(!mk) return ''; const [y,m]=mk.split('-'); return (MONTHS[Number(m)-1]||'')+' '+y; }
function isComplete(s){ return !!(s&&s.date&&s.code&&String(s.desc||'').trim()&&Number(s.price)>0); }
function todayISO(){
  const d=new Date();
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
}
function monthLastISO(month){
  const y=Number(String(month).slice(0,4)), m=Number(String(month).slice(5,7));
  const last=new Date(y, m, 0).getDate();
  return String(month).slice(0,7)+'-'+String(last).padStart(2,'0');
}
function reportingPeriod(month, today){
  today = today || todayISO();
  month = String(month||'').slice(0,7);
  if(!month) return {start:'', end:'', empty:true};
  const start = month+'-01';
  const last = monthLastISO(month);
  if(today < start) return {start, end:start, empty:true};
  return {start, end: today < last ? today : last, empty:false};
}
function contractPriceForMonth(ct, month){
  month = String(month||'').slice(0,7);
  if(ct && ct.contractPriceSnapshots && ct.contractPriceSnapshots[month]!=null) return Number(ct.contractPriceSnapshots[month])||0;
  return Number(ct && ct.contractPrice)||0;
}
function servicesInReportingMonth(c, ct, month, today){
  const p = reportingPeriod(month, today);
  if(p.empty) return [];
  return contractServices(c, ct.id).filter(s=>isComplete(s) && s.date>=p.start && s.date<=p.end);
}
function isAbonementSpecialMonth(c, ct, month, today){
  if(!ct || ct.status!=='Абонемент') return false;
  const p = reportingPeriod(month, today);
  if(p.empty) return false;
  const budget = contractPriceForMonth(ct, month);
  if(!(budget>0)) return false;
  const actual = servicesInReportingMonth(c, ct, month, today).reduce((a,s)=>a+(Number(s.price)||0),0);
  return actual < budget;
}
function displayContractTotals(c, ct, today){
  today = today || todayISO();
  const all = contractServices(c, ct.id).filter(isComplete);
  if(!ct || ct.status!=='Абонемент') return contractTotals(c, ct.id, all);
  const months = [...new Set(all.map(s=>monthKey(s.date)).filter(Boolean))];
  let sum=0, paid=0;
  months.forEach(m=>{
    const monthAll = all.filter(s=>monthKey(s.date)===m);
    const special = isAbonementSpecialMonth(c, ct, m, today);
    const modeList = servicesInReportingMonth(c, ct, m, today);
    const paidSrc = special ? modeList : monthAll;
    paid += paidSrc.reduce((a,s)=>a+paidOf(s),0);
    sum += special ? contractPriceForMonth(ct, m) : monthAll.reduce((a,s)=>a+(Number(s.price)||0),0);
  });
  return {sum, paid, debt:Math.max(0,sum-paid), count:all.length};
}
function paidOf(s){
  if(!s) return 0;
  if(s.pay==='full'||s.pay==='full_prepay') return Number(s.price)||0;
  if(s.pay==='part'||s.pay==='part_prepay') return Math.min(Number(s.payAmount)||0,Number(s.price)||0);
  return 0;
}
function prepayOf(s){
  if(!s) return 0;
  if(s.pay==='full_prepay') return Number(s.price)||0;
  if(s.pay==='part_prepay') return Math.min(Number(s.payAmount)||0,Number(s.price)||0);
  return 0;
}
function sortServices(list){
  return list.slice().sort((a,b)=>{
    const d=String(b.date||'').localeCompare(String(a.date||''));
    return d!==0?d:String(b.createdAt||'').localeCompare(String(a.createdAt||''));
  });
}
function getContract(c,id){ return (c.contracts||[]).find(x=>x.id===id)||null; }
function contractServices(c,id){ return (c.services||[]).filter(s=>s.contractId===id); }
function offerBasisDate(ct){
  if(!ct || ct.basisType!=='offer') return '';
  if(ct.offerDate) return ct.offerDate;
  if(ct.basisDate) return ct.basisDate;
  return '';
}
function basisText(ct, opts){
  opts = opts || {};
  if(!ct) return '';
  const useOffer = opts.useOfferWord !== false;
  if(ct.basisType==='contract') return 'договор'+(ct.basisDoc?' № '+ct.basisDoc:'')+(ct.basisDate?' от '+fmtDate(ct.basisDate):'');
  if(ct.basisType==='addendum'){
    let t = 'дополнительное соглашение'+(ct.basisDoc?' № '+ct.basisDoc:'')+(ct.basisDate?' от '+fmtDate(ct.basisDate):'');
    if(ct.basisParentDoc || ct.basisParentDate){
      t += ' к договору'+(ct.basisParentDoc?' № '+ct.basisParentDoc:'')+(ct.basisParentDate?' от '+fmtDate(ct.basisParentDate):'');
    }
    return t;
  }
  if(ct.basisType==='offer'){
    const d = offerBasisDate(ct);
    const word = useOffer ? 'оффер' : 'персональное предложение';
    return d ? word+' от '+fmtDate(d) : word;
  }
  if(ct.basisType==='request') return 'обращение'+(ct.basisDate?' от '+fmtDate(ct.basisDate):'');
  return '';
}
function contractLabel(ct){
  if(ct.title) return ct.title;
  const b = basisText(ct, {useOfferWord:false});
  return b ? b.charAt(0).toUpperCase()+b.slice(1) : 'Договор';
}
function contractBasisLabel(ct){
  const b = basisText(ct, {useOfferWord:true});
  return b ? b.charAt(0).toUpperCase()+b.slice(1) : contractLabel(ct);
}
function offerLinkHtml(ct){
  if(!ct || ct.basisType!=='offer' || !ct.basisUrl) return '';
  const d = offerBasisDate(ct);
  const label = d ? 'Оффер от '+fmtDate(d) : 'Оффер';
  return `<a class="offer-link" href="${esc(ct.basisUrl)}" target="_blank" rel="noopener">${esc(label)}</a>`;
}
function basisBlockHtml(ct){
  if(!ct) return '';
  if(ct.basisType==='offer' && ct.basisUrl){
    return `<div>Основание: ${offerLinkHtml(ct)}</div>`;
  }
  const b = contractBasisLabel(ct);
  return b ? `<div>Основание: ${esc(b)}</div>` : '';
}
function payPill(s){
  const price=Number(s.price)||0, paid=paidOf(s), pre=prepayOf(s)>0;
  let main;
  if(paid<=0) main='<span class="pill no">Не оплачено</span>';
  else if(paid>=price&&price>0) main='<span class="pill ok">Оплачено</span>';
  else main='<span class="pill part">Оплачено <wbr>частично</span>';
  return `<span class="pay-stack">${main}${pre?'<span class="pill pre">Предоплата</span>':''}</span>`;
}
function clientPayLabel(s){
  const paid=paidOf(s), price=Number(s.price)||0;
  if(paid<=0) return 'Не оплачено';
  if(paid>=price&&price>0) return 'Оплачено';
  return 'Оплачено частично';
}
function contractTotals(c,id,listOverride){
  const list=(listOverride||contractServices(c,id)).filter(isComplete);
  const sum=list.reduce((a,s)=>a+(Number(s.price)||0),0);
  const paid=list.reduce((a,s)=>a+paidOf(s),0);
  return {sum,paid,debt:Math.max(0,sum-paid),count:list.length};
}
function tot(l,v){ return `<div class="tot"><div class="l">${l}</div><div class="v">${v}</div></div>`; }
function grandTot(l,v){ return `<div class="grand-tot"><div class="l">${l}</div><div class="v">${v}</div></div>`; }

function appliedItems(s){
  return Array.isArray(s.applied)?s.applied.filter(a=>a&&a.name):[];
}
function formatAppliedLabel(a){
  if(typeof Calculator!=='undefined' && Calculator.formatAppliedLabel) return Calculator.formatAppliedLabel(a);
  const name=String(a.name||'').trim();
  const comment=String(a.comment||'').trim();
  return comment ? name+' ('+comment+')' : name;
}
function appliedHtml(s,expanded=false){
  const arr=appliedItems(s);
  if(!arr.length) return '';
  const items=arr.map(a=>`<li>${esc(formatAppliedLabel(a))}</li>`).join('');
  return `<details class="applied-box" ${expanded?'open':''}><summary>Применённые надбавки/скидки</summary><ul class="applied-list">${items}</ul></details>`;
}
function appliedText(s){
  const arr=appliedItems(s);
  if(!arr.length) return '';
  return 'Применены: '+arr.map(a=>{
    let t=String(a.name||'');
    if(a.amount) t+=' '+a.amount;
    if(a.comment) t+=' ('+a.comment+')';
    return t;
  }).join(', ')+'.';
}
function customFieldValue(raw){
  if(raw&&typeof raw==='object'&&!Array.isArray(raw)) return {value:String(raw.value??''),public:!!raw.public};
  return {value:String(raw??''),public:false};
}
function renderCustomFields(s,db){
  const fields=Array.isArray(db.customFields)?db.customFields:[];
  const out=[];
  fields.forEach(f=>{
    const raw=(s.custom||{})[f.id];
    const x=customFieldValue(raw);
    if(!x.public||!x.value.trim()) return;
    if(f.type==='bulleted'){
      const items=x.value.split(/\r?\n/).map(v=>v.trim()).filter(Boolean);
      out.push(`<div class="cf-public-item"><b>${esc(f.name)}:</b><ul>${items.map(v=>`<li>${esc(v)}</li>`).join('')}</ul></div>`);
    }else{
      const value=String(x.value).replace(/\r?\n/g,'<br>');
      out.push(`<div class="cf-public-item"><b>${esc(f.name)}:</b> ${value}</div>`);
    }
  });
  return out.length?`<div class="cf-public-list">${out.join('')}</div>`:'';
}
function offerLink(ct){
  return offerLinkHtml(ct);
}
function contractMeta(ct){
  const parts=[];
  if(ct.status) parts.push(esc(ct.status));
  if(ct.tariff) parts.push(esc(ct.tariff));
  if(Number(ct.discount)) parts.push('скидка '+Number(ct.discount)+'%');
  return parts.join(' · ');
}
function filtersTemplate(id, f){
  f = f || {};
  const openClass = FILTER_OPEN[id] ? 'open' : '';
  return `<div class="filter-box">
    <button class="filter-toggle" type="button" onclick="toggleFilters('${id}')">Фильтровать</button>
    <div class="filter-form ${openClass}" id="filters-${id}">
      <div><label>Дата с</label><input type="date" data-filter="from" value="${esc(f.from||'')}" onchange="renderContractById('${id}')"></div>
      <div><label>Дата по</label><input type="date" data-filter="to" value="${esc(f.to||'')}" onchange="renderContractById('${id}')"></div>
      <div><label>Код услуги</label><input type="text" data-filter="code" value="${esc(f.code||'')}" placeholder="Например, 3.8" oninput="renderContractById('${id}')"></div>
      <div><label>Статус оплаты</label><select data-filter="pay" onchange="renderContractById('${id}')"><option value="" ${!f.pay?'selected':''}>Любой</option><option value="none" ${f.pay==='none'?'selected':''}>Не оплачено</option><option value="paid" ${f.pay==='paid'?'selected':''}>Оплачено</option><option value="partial" ${f.pay==='partial'?'selected':''}>Оплачено частично</option><option value="prepay" ${f.pay==='prepay'?'selected':''}>С предоплатой</option></select></div>
      <div class="filter-actions"><button class="filter-reset" type="button" onclick="resetFilters('${id}')">Сбросить</button></div>
    </div>
  </div>`;
}
function getFilters(id){
  const box=document.getElementById('filters-'+id); if(!box) return {};
  const g=k=>box.querySelector(`[data-filter="${k}"]`)?.value.trim()||'';
  return {from:g('from'),to:g('to'),code:g('code').toLowerCase(),pay:g('pay')};
}
function filterServices(list,f){
  return list.filter(s=>{
    if(f.from&&(!s.date||s.date<f.from)) return false;
    if(f.to&&(!s.date||s.date>f.to)) return false;
    if(f.code&&String(s.code||'').toLowerCase().indexOf(f.code)<0) return false;
    const paid=paidOf(s),price=Number(s.price)||0;
    if(f.pay==='none'&&paid>0) return false;
    if(f.pay==='paid'&&!(price>0&&paid>=price)) return false;
    if(f.pay==='partial'&&!(paid>0&&paid<price)) return false;
    if(f.pay==='prepay'&&prepayOf(s)<=0) return false;
    return true;
  });
}
function toggleFilters(id){
  const box=document.getElementById('filters-'+id); if(!box) return;
  box.classList.toggle('open');
  FILTER_OPEN[id] = box.classList.contains('open');
}
function resetFilters(id){
  const box=document.getElementById('filters-'+id); if(!box) return;
  box.querySelectorAll('input').forEach(x=>x.value='');
  box.querySelectorAll('select').forEach(x=>x.value='');
  renderContractById(id);
}
let FILTER_OPEN = {};
let CURRENT_CLIENT=null, CURRENT_DB=null;
function renderContractById(id){
  if(!CURRENT_CLIENT||!CURRENT_DB) return;
  const ct=getContract(CURRENT_CLIENT,id);
  if(!ct) return;
  const saved = getFilters(id);
  const open = !!FILTER_OPEN[id];
  document.getElementById('contract-'+id).outerHTML=renderContract(CURRENT_CLIENT, ct, saved);
  const box = document.getElementById('filters-'+id);
  if(box && open) box.classList.add('open');
}
function renderServiceRow(s,num,special){
  const extra = special ? renderCustomFields(s,CURRENT_DB) : (appliedHtml(s)+renderCustomFields(s,CURRENT_DB));
  return `<div class="svc-row${special?' abon-special':''}">
    <div class="c-num">${num}</div><div class="c-date">${fmtDate(s.date)}</div><div class="c-code">${esc(s.code)}</div>
    <div class="c-desc">${esc(s.desc)}${extra}</div>
    ${special?'':`<div class="c-price">${money(s.price)}</div><div class="c-paid">${paidOf(s)?money(paidOf(s)):'—'}</div>`}
    <div class="c-status">${payPill(s)}</div>
    <div class="c-codedesc"><span class="pill no">${esc(s.code)}</span> ${esc(s.desc)}${extra}</div>
    <div class="c-priceinfo">${special?'':`<span class="price-main">${money(s.price)}</span><span class="paid-amt">Оплачено: ${paidOf(s)?money(paidOf(s)):'—'}</span>`}${payPill(s)}</div>
  </div>`;
}
function renderTable(list, special){
  const ordered=sortServices(list);
  const head = special
    ? `<div class="svc-head abon-special"><div>№</div><div>Дата</div><div>Код</div><div>Расшифровка услуги</div><div>Статус оплаты</div></div>`
    : `<div class="svc-head"><div>№</div><div>Дата</div><div>Код</div><div>Расшифровка услуги</div><div>Стоимость</div><div>Оплачено</div><div>Статус оплаты</div></div>`;
  return `${head}<div class="svc-list">${ordered.length?ordered.map((s,i)=>renderServiceRow(s,ordered.length-i,special)).join(''):'<div class="empty-filter">По заданным фильтрам услуг нет.</div>'}</div>`;
}
function renderContract(c,ct,presetFilters){
  const id=ct.id;
  const today=todayISO();
  const all=sortServices(contractServices(c,id).filter(isComplete));
  const f=presetFilters || getFilters(id);
  const list=filterServices(all,f);
  const t=displayContractTotals(c,ct,today);
  const filteredTotals=contractTotals(c,id,list);
  let body='';
  if(!list.length){ body='<div class="empty-filter">Нет услуг, соответствующих выбранным фильтрам.</div>'; }
  else if(ct.actMode==='monthly'){
    const groups={}; list.forEach(s=>(groups[monthKey(s.date)]??=[]).push(s));
    body=Object.keys(groups).sort().reverse().map(k=>{
      const g=sortServices(groups[k]);
      const special=isAbonementSpecialMonth(c, ct, k, today);
      const modeList=servicesInReportingMonth(c, ct, k, today);
      const gs=special ? contractPriceForMonth(ct, k) : g.reduce((a,s)=>a+(Number(s.price)||0),0);
      const gp=special ? modeList.reduce((a,s)=>a+paidOf(s),0) : g.reduce((a,s)=>a+paidOf(s),0);
      return `<h3>${esc(monthTitle(k))}</h3>${renderTable(g, special)}<div class="mtot">За ${esc(monthTitle(k))}: оказано на ${money(gs)}, оплачено ${money(gp)}, к оплате ${money(Math.max(0,gs-gp))}</div>`;
    }).join('');
  }else{
    const months=[...new Set(list.map(s=>monthKey(s.date)))];
    const allSpecial=ct.status==='Абонемент' && months.length>0 && months.every(m=>isAbonementSpecialMonth(c,ct,m,today));
    if(allSpecial) body=renderTable(list, true);
    else if(ct.status==='Абонемент'){
      const ordered=sortServices(list);
      body=`<div class="svc-head"><div>№</div><div>Дата</div><div>Код</div><div>Расшифровка услуги</div><div>Стоимость</div><div>Оплачено</div><div>Статус оплаты</div></div><div class="svc-list">${ordered.map((s,i)=>renderServiceRow(s,ordered.length-i,isAbonementSpecialMonth(c,ct,monthKey(s.date),today))).join('')}</div>`;
    } else body=renderTable(list, false);
  }
  return `<div class="contract-block" id="contract-${esc(id)}">
    <div class="contract-head"><div><div class="contract-title">${esc(contractLabel(ct))}</div>
      <div class="contract-meta">${contractMeta(ct)}${basisBlockHtml(ct)}</div>
    </div></div>
    ${filtersTemplate(id, f)}
    ${body}
    <div class="totals">${tot('Общая стоимость услуг',money(t.sum))}${tot('Оплачено',money(t.paid))}${tot('К оплате',money(t.debt))}</div>
    ${list.length!==all.length?`<div class="muted" style="margin-top:7px">Показано ${filteredTotals.count} из ${t.count} услуг.</div>`:''}
    ${(ct.sentDates||[]).length?`<div class="muted" style="margin-top:8px">Даты направления актов: ${ct.sentDates.map(fmtDate).join(', ')}</div>`:''}
  </div>`;
}
function renderClient(c,db){
  CURRENT_CLIENT=c; CURRENT_DB=db;
  const root=document.getElementById('root');
  const contracts=(c.contracts||[]).filter(ct=>ct.showInAct!==false);
  if(!contracts.length){root.innerHTML=`<div class="logo">RALEKSIZ HOUSE</div><div class="client-name">${esc(c.name)}</div><div class="state">Договоров пока нет.</div>`;return;}
  const today=todayISO();
  const grand=contracts.reduce((acc,ct)=>{const t=displayContractTotals(c,ct,today);acc.sum+=t.sum;acc.paid+=t.paid;acc.debt+=t.debt;return acc;},{sum:0,paid:0,debt:0});
  const sorted=contracts.slice().sort((a,b)=>String(b.createdAt||'').localeCompare(String(a.createdAt||'')));
  root.innerHTML=`<div class="logo">RALEKSIZ HOUSE</div><h1 class="client-name">${esc(c.name)}</h1><div class="muted" style="margin-bottom:16px">Акты оказанных услуг по всем договорам и основаниям</div>${sorted.map(ct=>renderContract(c,ct)).join('')}${contracts.length>1?`<div style="margin-top:4px"><h2 style="border-top:none;padding-top:0">Итого по всем договорам</h2><div class="grand-totals">${grandTot('Общая стоимость услуг',money(grand.sum))}${grandTot('Оплачено',money(grand.paid))}${grandTot('К оплате',money(grand.debt))}</div></div>`:''}`;
}
async function loadAndRender(){
  const root=document.getElementById('root');
  const params=new URLSearchParams(location.search),token=params.get('c');
  if(!token){root.innerHTML='<div class="state err">Ссылка недействительна: отсутствует идентификатор.</div>';return;}
  try{
    const res=await fetch(ACT_API+'?c='+encodeURIComponent(token)+'&t='+Date.now(),{cache:'no-store'});
    if(!res.ok && res.status!==404) throw new Error('fetch failed');
    const data=await res.json();
    if(!data || data.ok!==true || !data.client){
      root.innerHTML='<div class="state err">Заказчик не найден. Проверьте ссылку или обратитесь к исполнителю.</div>';
      return;
    }
    const c=data.client;
    c.contracts=Array.isArray(c.contracts)?c.contracts:[];
    c.services=Array.isArray(c.services)?c.services:[];
    const db={ customFields: Array.isArray(data.customFields)?data.customFields:[] };
    renderClient(c,db);
  }catch(e){console.error(e);root.innerHTML='<div class="state err">Не удалось загрузить данные. Проверьте интернет-соединение и обновите страницу.</div>';}
}
loadAndRender();
</script>
</body>
